<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição X / Lesson X</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#e0aaff;color:#1a0a2a}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a0a2a,#2a1a4a,#1a1a3a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
    .screen{display:none;width:100%;max-width:460px;flex-direction:column;align-items:center;gap:14px}
    .screen.active{display:flex}
    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(200,150,255,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#e0aaff}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#e0aaff}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:360px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#e0aaff;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#e0aaff}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#e0aaff,#aa55ee);color:#1a0a2a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(180,100,255,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#e0aaff}
    .progress-bar-wrap{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
    #progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#e0aaff,#aa55ee);transition:width .3s;border-radius:10px}

    .mission-card{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(200,150,255,.2);border-radius:16px;padding:14px}
    .mission-title{font-size:.72rem;color:#b088cc;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .mission-formula{font-size:1.05rem;font-weight:700;color:#e0aaff}
    .prop-legend{display:flex;flex-direction:column;gap:4px;margin-top:8px}
    .prop-item{font-size:.75rem;color:rgba(255,255,255,.65);display:flex;gap:6px}
    .prop-item strong{color:#e0aaff}

    /* TABLE */
    .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{border-collapse:collapse;width:100%;min-width:280px;font-size:.82rem}
    th{background:rgba(180,100,255,.3);color:#fff;padding:8px 6px;text-align:center;font-weight:700;white-space:nowrap;font-size:.78rem}
    th.fixed{background:rgba(100,60,160,.4)}
    td{padding:0;text-align:center;border:1px solid rgba(255,255,255,.1)}
    td.fixed{background:rgba(60,30,120,.3);color:#c0a8e0;font-weight:700;padding:8px 6px}
    .cell-btn{width:100%;height:100%;min-width:44px;padding:10px 6px;background:transparent;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:.88rem;font-weight:700;transition:background .15s}
    .cell-btn:hover,.cell-btn:focus{background:rgba(255,255,255,.1);outline:none}
    .cell-btn.selected-v{background:rgba(0,200,120,.25);color:#7effd4}
    .cell-btn.selected-f{background:rgba(255,80,80,.2);color:#ff9999}
    .cell-btn.correct{background:rgba(0,200,120,.4)!important;color:#7effd4!important;animation:flashGreen .4s}
    .cell-btn.wrong{background:rgba(255,80,80,.3)!important;color:#ff9999!important;animation:shake .3s}
    @keyframes flashGreen{0%,100%{background:rgba(0,200,120,.4)}50%{background:rgba(0,255,150,.6)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

    .cell-hint{font-size:.65rem;color:rgba(255,255,255,.25);display:block}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#e0aaff}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(200,150,255,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#e0aaff}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:360px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
    .sum-item .val{font-size:1.8rem;font-weight:800;color:#e0aaff}
    .sum-item .lbl{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:2px}

    /* TOAST */
    #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 18px;border-radius:20px;font-size:1rem;font-weight:600;text-align:center;width:max-content;max-width:90vw;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
    #toast.show{opacity:1}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">📊</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter"></span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div class="mission-card">
    <div class="mission-title" id="t-mission-label"></div>
    <div class="mission-formula" id="mission-formula"></div>
    <div class="prop-legend" id="prop-legend"></div>
  </div>
  <div class="table-wrap">
    <table id="truth-table"></table>
  </div>
  <p id="t-table-hint" style="font-size:.75rem;color:rgba(255,255,255,.35);text-align:center"></p>
</div>

<div id="toast"></div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>
/* ── TEXTOS DA INTERFACE / UI STRINGS ─────────────── */
const UI = {
  pt: {
    pageTitle: "No Mundo da Lógica — Lição X",
    htmlLang: "pt-BR",
    badge: "No Mundo da Lógica · Lição X",
    title: 'Construindo a<br><span>Tabela-Verdade</span>',
    subtitle: "O Senhor x precisa montar tabelas-verdade com três proposições. Preencha cada célula com V ou F tocando nela!",
    rulesTitle: "Como jogar",
    rule1: "As colunas p, q, r já estão preenchidas",
    rule2: "Toque em cada célula vazia para alternar V/F",
    rule3: "Quando estiver certo, a célula fica verde ✅",
    rule4: "Complete toda a tabela para avançar!",
    btnStart: "Montar a Tabela 📊",
    backLink: "← Todas as lições",
    tableWord: "Tabela ",
    ptsLabel: "pts",
    missionLabel: "📋 Complete a tabela-verdade de:",
    tableHint: "Toque nas células cinzas para alternar V/F",
    correctToast: "✅ Correto! +10 pts",
    resultTitle: 'Tabelas<br><span>completas!</span>',
    maxScoreLabel: "pontos totais",
    correctCellsLabel: "Células corretas",
    wrongLabel: "Erros",
    btnRestart: "Jogar novamente 🔄",
    msgLow: "Continue praticando as tabelas-verdade! 📖",
    msgMid: "Bom esforço! Revise a ordem de prioridade dos conectivos. 💪",
    msgGood: "Muito bom! Você está dominando as tabelas-verdade! 😊",
    msgGreat: "Mestre da tabela-verdade! O Senhor x te contratou! 🏆",
    trueLabel: "V"
  },
  en: {
    pageTitle: "In the World of Logic — Lesson X",
    htmlLang: "en",
    badge: "In the World of Logic · Lesson X",
    title: 'Building the<br><span>Truth Table</span>',
    subtitle: "Mr. x needs to build truth tables with three propositions. Fill in each cell with T or F by tapping it!",
    rulesTitle: "How to play",
    rule1: "The columns p, q, r are already filled in",
    rule2: "Tap each empty cell to toggle T/F",
    rule3: "When it's correct, the cell turns green ✅",
    rule4: "Complete the whole table to move on!",
    btnStart: "Build the Table 📊",
    backLink: "← All lessons",
    tableWord: "Table ",
    ptsLabel: "pts",
    missionLabel: "📋 Complete the truth table for:",
    tableHint: "Tap the gray cells to toggle T/F",
    correctToast: "✅ Correct! +10 pts",
    resultTitle: 'Tables<br><span>complete!</span>',
    maxScoreLabel: "total points",
    correctCellsLabel: "Correct cells",
    wrongLabel: "Errors",
    btnRestart: "Play again 🔄",
    msgLow: "Keep practicing the truth tables! 📖",
    msgMid: "Good effort! Review the priority order of the connectives. 💪",
    msgGood: "Very good! You're mastering the truth tables! 😊",
    msgGreat: "Master of the truth table! Mr. x hired you! 🏆",
    trueLabel: "T"
  }
};

/* ── CONTEÚDO BILÍNGUE / BILINGUAL CONTENT — Two tables to fill ── */
const TABLES=[
  {
    formula:"(p ∧ q) → r",
    legend:[
      {k:"p",t:{pt:"Deus é fiel.",en:"God is faithful."}},
      {k:"q",t:{pt:"Jesus ressuscitou.",en:"Jesus rose from the dead."}},
      {k:"r",t:{pt:"O Espírito Santo habita nos que creem.",en:"The Holy Spirit dwells in those who believe."}}
    ],
    headers:["p","q","r","p ∧ q","(p∧q)→r"],
    rows:[
      // p,q,r fixed; col4=p∧q; col5=(p∧q)→r
      [true,true,true,   true, true],
      [true,true,false,  true, false],
      [true,false,true,  false,true],
      [true,false,false, false,true],
      [false,true,true,  false,true],
      [false,true,false, false,true],
      [false,false,true, false,true],
      [false,false,false,false,true],
    ],
    fixedCols:[0,1,2] // p,q,r are given
  },
  {
    formula:"p ∨ (q → r)",
    legend:[
      {k:"p",t:{pt:"O homem pecou.",en:"Man sinned."}},
      {k:"q",t:{pt:"Jesus morreu na cruz.",en:"Jesus died on the cross."}},
      {k:"r",t:{pt:"O homem pode ser perdoado.",en:"Man can be forgiven."}}
    ],
    headers:["p","q","r","q → r","p∨(q→r)"],
    rows:[
      [true, true, true,  true, true],
      [true, true, false, false,true],
      [true, false,true,  true, true],
      [true, false,false, true, true],
      [false,true, true,  true, true],
      [false,true, false, false,false],
      [false,false,true,  true, true],
      [false,false,false, true, true],
    ],
    fixedCols:[0,1,2]
  }
];

/* ── IDIOMA / LANGUAGE ───────────────────────────── */
let LANG = 'pt';
try {
  const saved = localStorage.getItem('nml_lang');
  if (saved === 'pt' || saved === 'en') LANG = saved;
} catch (e) { /* localStorage indisponível / unavailable */ }

function tr(v){ return (v && typeof v === 'object' && (('pt' in v) || ('en' in v))) ? v[LANG] : v; }
function TLabel(){ return UI[LANG].trueLabel; }

function setLang(lang){
  LANG = lang;
  try { localStorage.setItem('nml_lang', lang); } catch (e) { /* ignore */ }
  applyChrome();
  if (document.getElementById('screen-game').classList.contains('active')) {
    refreshGameLanguage();
  } else if (document.getElementById('screen-result').classList.contains('active')) {
    renderResultTexts();
  }
}

function applyChrome(){
  const s = UI[LANG];
  document.documentElement.lang = s.htmlLang;
  document.title = s.pageTitle;
  document.getElementById('lang-btn-pt').classList.toggle('active', LANG === 'pt');
  document.getElementById('lang-btn-en').classList.toggle('active', LANG === 'en');
  document.getElementById('t-badge').textContent = s.badge;
  document.getElementById('t-title').innerHTML = s.title;
  document.getElementById('t-subtitle').textContent = s.subtitle;
  document.getElementById('t-rules-title').textContent = s.rulesTitle;
  document.getElementById('t-rule1').textContent = s.rule1;
  document.getElementById('t-rule2').textContent = s.rule2;
  document.getElementById('t-rule3').textContent = s.rule3;
  document.getElementById('t-rule4').textContent = s.rule4;
  document.getElementById('t-btn-start').textContent = s.btnStart;
  document.getElementById('t-back-1').textContent = s.backLink;
  document.getElementById('t-back-2').textContent = s.backLink;
  document.getElementById('t-pts-label').textContent = s.ptsLabel;
  document.getElementById('t-mission-label').textContent = s.missionLabel;
  document.getElementById('t-table-hint').textContent = s.tableHint;
  document.getElementById('t-result-title').innerHTML = s.resultTitle;
  document.getElementById('t-max-score').textContent = s.maxScoreLabel;
  document.getElementById('t-correct-label').textContent = s.correctCellsLabel;
  document.getElementById('t-wrong-label').textContent = s.wrongLabel;
  document.getElementById('t-btn-restart').textContent = s.btnRestart;
}

/* ── JOGO / GAME ─────────────────────────────────── */
let current=0, score=0, totalCorrect=0, totalWrong=0;
let cellStates={}, cellCorrect={}, cellTries={};
let lastPct=null;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

function startGame(){current=0;score=0;totalCorrect=0;totalWrong=0;show('screen-game');loadTable()}

function loadTable(){
  if(current>=TABLES.length){endGame();return}
  const t=TABLES[current];
  document.getElementById('counter').textContent=`${UI[LANG].tableWord}${current+1} / ${TABLES.length}`;
  document.getElementById('live-score').textContent=score;
  document.getElementById('mission-formula').textContent=t.formula;
  // Legend
  const leg=document.getElementById('prop-legend');
  leg.innerHTML=t.legend.map(l=>`<div class="prop-item"><strong>${l.k}:</strong> ${tr(l.t)}</div>`).join('');
  // Reset cell state
  cellStates={};cellCorrect={};cellTries={};
  buildTable(t);
  updateProgress(0,t.rows.length*(t.headers.length-t.fixedCols.length));
}

function buildTable(t){
  const table=document.getElementById('truth-table');
  table.innerHTML='';
  // Header
  const thead=document.createElement('thead');
  const hr=document.createElement('tr');
  t.headers.forEach((h,i)=>{
    const th=document.createElement('th');
    th.textContent=h;
    if(t.fixedCols.includes(i))th.classList.add('fixed');
    hr.appendChild(th);
  });
  thead.appendChild(hr);table.appendChild(thead);
  // Body
  const tbody=document.createElement('tbody');
  t.rows.forEach((row,ri)=>{
    const tr_=document.createElement('tr');
    row.forEach((val,ci)=>{
      const td=document.createElement('td');
      if(t.fixedCols.includes(ci)){
        td.className='fixed';td.dataset.val=val?'1':'0';td.textContent=val?TLabel():'F';
      } else {
        const key=`${ri}-${ci}`;
        cellStates[key]='';cellCorrect[key]=val;cellTries[key]=0;
        const btn=document.createElement('button');
        btn.className='cell-btn';btn.id='cell-'+key;
        btn.textContent='—';btn.dataset.key=key;
        btn.onclick=()=>toggleCell(key,t);
        td.appendChild(btn);
      }
      tr_.appendChild(td);
    });
    tbody.appendChild(tr_);
  });
  table.appendChild(tbody);
}

function toggleCell(key,t){
  const btn=document.getElementById('cell-'+key);
  if(btn.classList.contains('correct'))return; // already correct
  const cur=cellStates[key];
  const next=(cur===''||cur==='F')?'V':'F';
  cellStates[key]=next;
  btn.textContent=(next==='V')?TLabel():'F';
  btn.className='cell-btn '+(next==='V'?'selected-v':'selected-f');
  // check
  const correct=cellCorrect[key];
  const isV=(next==='V');
  if(isV===correct){
    btn.classList.add('correct');
    // acerto de primeira vale 10; depois de um erro, vale só 2
    score+=cellTries[key]?2:10; if(!cellTries[key])totalCorrect++;
    document.getElementById('live-score').textContent=score;
    showToast(UI[LANG].correctToast);
    checkTableComplete(t);
  } else {
    // conta o erro já na primeira tentativa errada (antes, como só há V e F, o erro nunca era contado)
    if(!cellTries[key])totalWrong++;
    cellTries[key]=(cellTries[key]||0)+1;
    btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),400);
  }
}

function checkTableComplete(t){
  const total=t.rows.length*(t.headers.length-t.fixedCols.length);
  const done=Object.keys(cellCorrect).filter(k=>document.getElementById('cell-'+k).classList.contains('correct')).length;
  updateProgress(done,total);
  if(done>=total){
    score+=50; // bonus
    document.getElementById('live-score').textContent=score;
    setTimeout(()=>{current++;loadTable()},1500);
  }
}

function updateProgress(done,total){
  document.getElementById('progress-bar').style.width=(total?done/total*100:0)+'%';
}

/* Re-renders the parts of the game screen that depend on language,
   without touching any game state or progress (used on language switch). */
function refreshGameLanguage(){
  const t=TABLES[current];
  if(!t)return;
  document.getElementById('counter').textContent=`${UI[LANG].tableWord}${current+1} / ${TABLES.length}`;
  const leg=document.getElementById('prop-legend');
  leg.innerHTML=t.legend.map(l=>`<div class="prop-item"><strong>${l.k}:</strong> ${tr(l.t)}</div>`).join('');
  document.querySelectorAll('#truth-table td.fixed').forEach(td=>{
    td.textContent = td.dataset.val==='1' ? TLabel() : 'F';
  });
  Object.keys(cellStates).forEach(key=>{
    const st=cellStates[key];
    if(st==='V'||st==='F'){
      const btn=document.getElementById('cell-'+key);
      if(btn)btn.textContent = (st==='V') ? TLabel() : 'F';
    }
  });
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

function endGame(){
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=totalCorrect;
  document.getElementById('r-wrong').textContent=totalWrong;
  lastPct=totalCorrect/Math.max(1,totalCorrect+totalWrong);
  let stars='⭐';
  if(lastPct>=.9){stars='⭐⭐⭐'}
  else if(lastPct>=.7){stars='⭐⭐'}
  else if(lastPct>=.5){stars='⭐½'}
  document.getElementById('result-stars').textContent=stars;
  renderResultTexts();
}

function renderResultTexts(){
  if(lastPct===null)return;
  const s=UI[LANG];
  let msg=s.msgLow;
  if(lastPct>=.9){msg=s.msgGreat}
  else if(lastPct>=.7){msg=s.msgGood}
  else if(lastPct>=.5){msg=s.msgMid}
  document.getElementById('result-msg').textContent=msg;
}

function restartGame(){startGame()}

/* ── INICIALIZAÇÃO / INIT ────────────────────────── */
applyChrome();
</script>
</body>
</html>
