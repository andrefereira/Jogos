<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição XI / Lesson XI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a2a0a,#1a4a1a,#0a3a2a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
    .screen{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:14px}
    .screen.active{display:flex}

    /* LANGUAGE SWITCH */
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#7effd4;color:#0a2a0a}

    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(100,255,150,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#7effd4}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#7effd4}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:340px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#7effd4;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#7effd4}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#ffd700,#ffaa00);color:#0a2a0a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(255,215,0,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#ffd700}
    .streak-display{font-size:.88rem;color:#ff9933;font-weight:700}

    /* QUEUE */
    .queue-area{width:100%;position:relative;min-height:170px}
    .queue-label{font-size:.7rem;color:rgba(255,255,255,.3);text-align:center;margin-bottom:4px}
    .queue-cards{display:flex;flex-direction:column;gap:6px;width:100%}
    .queue-card{background:rgba(255,255,255,.08);border:1px solid rgba(100,255,150,.15);border-radius:12px;padding:10px 14px;transition:all .3s;opacity:.5;transform:scale(.96)}
    .queue-card.active{background:rgba(255,255,255,.95);color:#0a2a0a;opacity:1;transform:scale(1);box-shadow:0 6px 20px rgba(0,0,0,.3);border-color:transparent}
    .queue-card.active .card-values{color:#0a6a2a}
    .queue-card.active .card-expr{color:#0a2a0a}
    .card-values{font-size:.72rem;font-weight:600;color:rgba(255,255,255,.4);margin-bottom:4px}
    .card-expr{font-size:1.05rem;font-weight:800}
    .card-eq{font-size:.9rem;font-weight:700;color:#555}

    /* TIMER ARC */
    .timer-arc-wrap{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
    #timer-arc{transform:rotate(-90deg)}
    .timer-text{font-size:.8rem;font-weight:700;color:#ffd700;text-align:center}

    /* ANSWER BUTTONS */
    .answer-row{width:100%;display:flex;gap:14px}
    .btn-answer{flex:1;padding:18px 10px;border:none;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:1rem;transition:transform .1s;box-shadow:0 4px 15px rgba(0,0,0,.2)}
    .btn-answer:active{transform:scale(.93)}
    .btn-answer .face{font-size:2.8rem}
    #btn-v{background:linear-gradient(135deg,#00c87a,#00a862);color:#fff}
    #btn-f{background:linear-gradient(135deg,#ff6b6b,#e0303a);color:#fff}

    /* FEEDBACK flash */
    .flash-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50}
    .flash-overlay.correct{background:rgba(0,200,120,.25)}
    .flash-overlay.wrong{background:rgba(255,80,80,.25)}
    .flash-overlay.show{opacity:1}

    /* FEEDBACK modal */
    #feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:20px}
    #feedback.show{display:flex}
    .fb-card{background:#fff;color:#0a2a0a;border-radius:22px;padding:26px 22px;text-align:center;max-width:320px;width:100%;animation:popIn .2s ease-out}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .fb-icon{font-size:3.5rem}.fb-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px}
    .fb-title.ok{color:#00a862}.fb-title.no{color:#e0303a}
    .fb-exp{font-size:.82rem;color:#555;background:#f0fff4;border-radius:10px;padding:10px;margin-top:8px;line-height:1.5}
    .fb-pts{font-size:.9rem;color:#888;margin-top:4px}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#7effd4}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(100,255,150,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#ffd700}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:340px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:12px}
    .sum-item .val{font-size:1.6rem;font-weight:800;color:#7effd4}
    .sum-item .lbl{font-size:.7rem;color:rgba(255,255,255,.6);margin-top:2px}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">⚡</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter">1 / 10</span>
    <span class="score-display">⭐ <span id="live-score">0</span></span>
    <span class="streak-display">🔥 <span id="streak">0</span>x</span>
  </div>

  <!-- Circular timer -->
  <div class="timer-arc-wrap">
    <svg id="timer-arc" width="60" height="60" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>
      <circle id="timer-ring" cx="30" cy="30" r="26" fill="none" stroke="#ffd700" stroke-width="5"
        stroke-dasharray="163.4" stroke-dashoffset="0" stroke-linecap="round"/>
    </svg>
    <div class="timer-text" id="timer-text">8s</div>
  </div>

  <!-- Active card + queue -->
  <div class="queue-label" id="t-queue-label"></div>
  <div class="queue-cards" id="queue-cards"></div>

  <div class="answer-row">
    <button class="btn-answer" id="btn-v" onclick="answer(true)">
      <span class="face">😊</span><span id="t-true-label"></span>
    </button>
    <button class="btn-answer" id="btn-f" onclick="answer(false)">
      <span class="face">😢</span><span id="t-false-label"></span>
    </button>
  </div>
</div>

<div class="flash-overlay" id="flash"></div>

<div id="feedback" onclick="nextQ()">
  <div class="fb-card">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-pts"  id="fb-pts"></div>
    <div class="fb-exp"  id="fb-exp"></div>
    <p style="font-size:.75rem;color:#aaa;margin-top:12px" id="t-tap-continue"></p>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
    <div class="sum-item"><div class="val" id="r-best">—</div><div class="lbl" id="t-best-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>
/* ── TEXTOS DA INTERFACE / UI STRINGS ─────────────── */
const STRINGS = {
  pt: {
    pageTitle: "No Mundo da Lógica — Lição XI",
    htmlLang: "pt-BR",
    badge: "No Mundo da Lógica · Lição XI",
    title: 'Fila Urgente<br><span>do Senhor x</span>',
    subtitle: "O Governador de Proposia está esperando! Avalie as proposições compostas o mais rápido possível, sem montar a tabela!",
    rulesTitle: "Como jogar",
    rule1: 'Cada proposição tem <strong>8 segundos</strong>',
    rule2: "Toque 😊 se for Verdadeira, 😢 se for Falsa",
    rule3: "Sequência de acertos multiplica os pontos!",
    rule4: "Resista até o fim da fila!",
    btnStart: "Iniciar Fila ⚡",
    backLink: "← Todas as lições",
    trueLabel: "VERDADEIRA",
    falseLabel: "FALSA",
    queueLabel: "Fila de proposições:",
    tapContinue: "Toque para continuar",
    resultTitle: 'Fila<br><span>atendida!</span>',
    maxScore: n => `de ${n}+ pontos`,
    correctLabel: "Acertos",
    wrongLabel: "Erros",
    bestLabel: "Melhor sequência",
    btnRestart: "Jogar novamente 🔄",
    timeUp: "Tempo esgotado!",
    correctTitle: streak => "Correto!" + (streak >= 3 ? " 🔥x" + streak : ""),
    wrongTitle: "Errado!",
    ptsEarned: (pts, streak) => "+" + pts + " pontos" + (streak >= 3 ? " (bônus de sequência!)" : ""),
    ptsZero: "",
    msgLow: "Continue treinando a avaliação rápida! 📖",
    msgMid: "Bom esforço! Revise as regras de ouro de cada conectivo. 💪",
    msgGood: "Muito bom! Você avalia proposições como um profissional! 😊",
    msgGreat: "O Governador está impressionado! Você é veloz e preciso! 🏆"
  },
  en: {
    pageTitle: "In the World of Logic — Lesson XI",
    htmlLang: "en",
    badge: "In the World of Logic · Lesson XI",
    title: 'Urgent Line<br><span>of Mr. x</span>',
    subtitle: "The Governor of Propositia is waiting! Evaluate the compound propositions as fast as possible, without building the table!",
    rulesTitle: "How to play",
    rule1: 'Each proposition gives you <strong>8 seconds</strong>',
    rule2: "Tap 😊 if it's True, 😢 if it's False",
    rule3: "A streak of correct answers multiplies your points!",
    rule4: "Hold on until the end of the line!",
    btnStart: "Start the Line ⚡",
    backLink: "← All lessons",
    trueLabel: "TRUE",
    falseLabel: "FALSE",
    queueLabel: "Queue of propositions:",
    tapContinue: "Tap to continue",
    resultTitle: 'Line<br><span>cleared!</span>',
    maxScore: n => `out of ${n}+ points`,
    correctLabel: "Correct",
    wrongLabel: "Wrong",
    bestLabel: "Best streak",
    btnRestart: "Play again 🔄",
    timeUp: "Time's up!",
    correctTitle: streak => "Correct!" + (streak >= 3 ? " 🔥x" + streak : ""),
    wrongTitle: "Wrong!",
    ptsEarned: (pts, streak) => "+" + pts + " points" + (streak >= 3 ? " (streak bonus!)" : ""),
    ptsZero: "",
    msgLow: "Keep practicing quick evaluation! 📖",
    msgMid: "Good effort! Review the golden rules of each connective. 💪",
    msgGood: "Very good! You evaluate propositions like a professional! 😊",
    msgGreat: "The Governor is impressed! You're fast and precise! 🏆"
  }
};

/* ── FILA DE PROPOSIÇÕES / QUEUE (bilíngue) ───────── */
const QUEUE=[
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"p ∧ q",result:true,exp:{pt:"V ∧ V = V. Conjunção: ambas V → V.",en:"T ∧ T = T. Conjunction: both T → T."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"p ∧ s",result:false,exp:{pt:"V ∧ F = F. Conjunção: uma delas é F → F.",en:"T ∧ F = F. Conjunction: one of them is F → F."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"q ∨ s",result:true,exp:{pt:"V ∨ F = V. Disjunção: ao menos uma é V → V.",en:"T ∨ F = T. Disjunction: at least one is T → T."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"r ∨ s",result:true,exp:{pt:"V ∨ F = V. Disjunção: r é V → V.",en:"T ∨ F = T. Disjunction: r is T → T."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"p → q",result:true,exp:{pt:"V → V = V. Condicional: não é quebrada.",en:"T → T = T. Conditional: it isn't broken."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"p → s",result:false,exp:{pt:"V → F = F. Condicional: p=V e s=F → quebrada!",en:"T → F = F. Conditional: p=T and s=F → broken!"}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"s → p",result:true,exp:{pt:"F → V = V. Condicional: antecedente F → sempre V.",en:"F → T = T. Conditional: antecedent F → always T."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"p ↔ q",result:true,exp:{pt:"V ↔ V = V. Bicondicional: iguais → V.",en:"T ↔ T = T. Biconditional: equal → T."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"p ↔ s",result:false,exp:{pt:"V ↔ F = F. Bicondicional: diferentes → F.",en:"T ↔ F = F. Biconditional: different → F."}},
  {values:{pt:"p=V, q=V, r=V, s=F",en:"p=T, q=T, r=T, s=F"},expr:"¬p",result:false,exp:{pt:"¬V = F. Negação: sempre o oposto.",en:"¬T = F. Negation: always the opposite."}},
  {values:{pt:"p=V, q=F, r=V, s=F",en:"p=T, q=F, r=T, s=F"},expr:"p ∧ q",result:false,exp:{pt:"V ∧ F = F. Conjunção: uma é F → F.",en:"T ∧ F = F. Conjunction: one is F → F."}},
  {values:{pt:"p=V, q=F, r=V, s=F",en:"p=T, q=F, r=T, s=F"},expr:"p ∨ q",result:true,exp:{pt:"V ∨ F = V. Disjunção: p é V → V.",en:"T ∨ F = T. Disjunction: p is T → T."}},
  {values:{pt:"p=V, q=F, r=V, s=F",en:"p=T, q=F, r=T, s=F"},expr:"q ∨ s",result:false,exp:{pt:"F ∨ F = F. Disjunção: ambas F → F.",en:"F ∨ F = F. Disjunction: both F → F."}},
  {values:{pt:"p=V, q=F, r=V, s=F",en:"p=T, q=F, r=T, s=F"},expr:"¬q",result:true,exp:{pt:"¬F = V. Negação de F é V.",en:"¬F = T. Negation of F is T."}},
  {values:{pt:"p=V, q=F, r=V, s=F",en:"p=T, q=F, r=T, s=F"},expr:"q → p",result:true,exp:{pt:"F → V = V. Antecedente é F → condicional V.",en:"F → T = T. Antecedent is F → conditional T."}},
];

const TIME=8;
const NUM_Q=10;
const MAX_PTS_BASE=100;
const CIRCUMFERENCE=163.4; // 2π×26
let questions,current,score,streak,maxStreak,correctCount,wrongCount,timer,qStart;

let LANG='pt';
try{
  const saved=localStorage.getItem('nml_lang');
  if(saved==='pt'||saved==='en')LANG=saved;
}catch(e){ /* localStorage indisponível / unavailable — mantém pt / keep default */ }

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* ── IDIOMA / LANGUAGE ────────────────────────────── */
function setLang(lang){
  LANG=lang;
  try{localStorage.setItem('nml_lang',lang)}catch(e){ /* ignore */ }
  applyChrome();
  // Se o jogo já estiver em andamento, atualiza a fila exibida
  // If the game is already running, refresh the displayed queue
  if(typeof questions!=='undefined' && questions && questions[current] &&
     document.getElementById('screen-game').classList.contains('active')){
    loadQ();
  }
}

function applyChrome(){
  const s=STRINGS[LANG];
  document.documentElement.lang=s.htmlLang;
  document.title=s.pageTitle;

  document.getElementById('lang-btn-pt').classList.toggle('active',LANG==='pt');
  document.getElementById('lang-btn-en').classList.toggle('active',LANG==='en');

  document.getElementById('t-badge').textContent=s.badge;
  document.getElementById('t-title').innerHTML=s.title;
  document.getElementById('t-subtitle').textContent=s.subtitle;
  document.getElementById('t-rules-title').textContent=s.rulesTitle;
  document.getElementById('t-rule1').innerHTML=s.rule1;
  document.getElementById('t-rule2').textContent=s.rule2;
  document.getElementById('t-rule3').textContent=s.rule3;
  document.getElementById('t-rule4').textContent=s.rule4;
  document.getElementById('t-btn-start').textContent=s.btnStart;
  document.getElementById('t-back-1').textContent=s.backLink;
  document.getElementById('t-back-2').textContent=s.backLink;
  document.getElementById('t-true-label').textContent=s.trueLabel;
  document.getElementById('t-false-label').textContent=s.falseLabel;
  document.getElementById('t-queue-label').textContent=s.queueLabel;
  document.getElementById('t-tap-continue').textContent=s.tapContinue;
  document.getElementById('t-result-title').innerHTML=s.resultTitle;
  document.getElementById('t-max-score').textContent=s.maxScore(NUM_Q*MAX_PTS_BASE);
  document.getElementById('t-correct-label').textContent=s.correctLabel;
  document.getElementById('t-wrong-label').textContent=s.wrongLabel;
  document.getElementById('t-best-label').textContent=s.bestLabel;
  document.getElementById('t-btn-restart').textContent=s.btnRestart;
}

function startGame(){
  questions=shuffle(QUEUE).slice(0,NUM_Q);
  current=0;score=0;streak=0;maxStreak=0;correctCount=0;wrongCount=0;
  show('screen-game');loadQ();
}

function loadQ(){
  if(current>=questions.length){endGame();return}
  const q=questions[current];
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('live-score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('btn-v').disabled=false;
  document.getElementById('btn-f').disabled=false;

  // Render visible cards (active + next 2 preview)
  const cards=document.getElementById('queue-cards');
  cards.innerHTML='';
  for(let i=current;i<Math.min(current+3,questions.length);i++){
    const qc=questions[i];
    const div=document.createElement('div');
    div.className='queue-card'+(i===current?' active':'');
    div.innerHTML=`<div class="card-values">${qc.values[LANG]}</div>
      <div class="card-expr">${qc.expr} <span class="card-eq">= ?</span></div>`;
    cards.appendChild(div);
  }

  // Timer
  const ring=document.getElementById('timer-ring');
  ring.style.stroke='#ffd700';
  ring.style.strokeDashoffset='0';
  qStart=Date.now();
  clearInterval(timer);
  timer=setInterval(()=>{
    const e=(Date.now()-qStart)/1000;
    const pct=Math.max(0,1-e/TIME);
    ring.style.strokeDashoffset=(CIRCUMFERENCE*(1-pct)).toFixed(1);
    document.getElementById('timer-text').textContent=Math.ceil(TIME-e)+'s';
    if(pct<.3)ring.style.stroke='#ff6b6b';
    else if(pct<.6)ring.style.stroke='#ffaa00';
    if(e>=TIME){clearInterval(timer);answer(null)}
  },80);
}

function answer(userV){
  clearInterval(timer);
  document.getElementById('btn-v').disabled=true;
  document.getElementById('btn-f').disabled=true;
  const s=STRINGS[LANG];
  const q=questions[current];
  const ok=(userV===q.result);
  const timeout=(userV===null);
  let pts=0;
  if(ok){
    streak++;if(streak>maxStreak)maxStreak=streak;
    const e=(Date.now()-qStart)/1000;
    pts=Math.max(20,Math.round(100-e/TIME*70));
    if(streak>=3)pts=Math.round(pts*1.5); // streak bonus
    score+=pts;correctCount++;
  } else {streak=0;wrongCount++}
  // Flash
  const fl=document.getElementById('flash');
  fl.className='flash-overlay '+(ok?'correct':'wrong')+' show';
  setTimeout(()=>fl.classList.remove('show'),250);
  document.getElementById('live-score').textContent=score;
  document.getElementById('streak').textContent=streak;

  setTimeout(()=>{
    document.getElementById('fb-icon').textContent=ok?'⚡✅':timeout?'⏱️':'❌';
    document.getElementById('fb-title').textContent=ok?s.correctTitle(streak):timeout?s.timeUp:s.wrongTitle;
    document.getElementById('fb-title').className='fb-title '+(ok?'ok':'no');
    document.getElementById('fb-pts').textContent=ok?s.ptsEarned(pts,streak):s.ptsZero;
    document.getElementById('fb-exp').textContent=q.exp[LANG];
    document.getElementById('feedback').classList.add('show');
  },300);
}

function nextQ(){document.getElementById('feedback').classList.remove('show');current++;loadQ()}

function endGame(){
  const s=STRINGS[LANG];
  clearInterval(timer);
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=correctCount;
  document.getElementById('r-wrong').textContent=wrongCount;
  document.getElementById('r-best').textContent=maxStreak+'🔥';
  const pct=correctCount/questions.length;
  let stars='⭐',msg=s.msgLow;
  if(pct>=.9){stars='⭐⭐⭐';msg=s.msgGreat}
  else if(pct>=.7){stars='⭐⭐';msg=s.msgGood}
  else if(pct>=.5){stars='⭐½';msg=s.msgMid}
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-msg').textContent=msg;
}
function restartGame(){startGame()}

/* ── INICIALIZAÇÃO / INIT ─────────────────────────── */
applyChrome();
</script>
