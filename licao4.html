<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição IV / Lesson IV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a2a3a,#0d3a4f,#1a4a5c);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
    .screen{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:16px}
    .screen.active{display:flex}

    /* LANGUAGE SWITCH */
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#aaccff;color:#0d1a2a}

    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(200,200,255,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#c8c8ff}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#aaccff}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:340px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#c8c8ff;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#aaccff}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#aaccff,#6699ee);color:#0d1a2a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(100,150,255,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#c8c8ff}

    .mirror-scene{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
    .prop-card{width:100%;background:rgba(255,255,255,.95);color:#1a2a3a;border-radius:16px;padding:18px;text-align:center;font-size:.95rem;font-weight:600;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.3)}
    .prop-label{font-size:.75rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .arrow-down{font-size:1.5rem;color:rgba(255,255,255,.4)}
    .mirror-label{font-size:.75rem;color:#aaccff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}

    .mirrors-row{width:100%;display:flex;flex-direction:column;gap:8px}
    .mirror-opt{width:100%;padding:14px 16px;background:rgba(255,255,255,.08);border:2px solid rgba(200,200,255,.25);border-radius:14px;color:#fff;font-size:.88rem;font-weight:500;line-height:1.4;cursor:pointer;text-align:left;transition:background .15s,transform .1s;position:relative;overflow:hidden}
    .mirror-opt::before{content:'🔮 ';font-size:.9rem}
    .mirror-opt:active{transform:scale(.98)}
    .mirror-opt.correct{background:rgba(0,200,120,.25);border-color:#00c878;animation:none}
    .mirror-opt.wrong{animation:shatter .4s ease forwards}
    @keyframes shatter{0%{transform:scale(1)}30%{transform:scale(1.04) rotate(1deg)}60%{transform:scale(.95) rotate(-2deg);opacity:.8}100%{transform:scale(.9);opacity:.4}}

    /* FEEDBACK */
    #feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
    #feedback.show{display:flex}
    .fb-card{background:#fff;color:#1a2a3a;border-radius:22px;padding:26px 22px;text-align:center;max-width:320px;width:100%;animation:popIn .2s ease-out}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .fb-icon{font-size:3.5rem}.fb-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px}
    .fb-title.ok{color:#00a862}.fb-title.no{color:#e0303a}
    .fb-correct{font-size:.85rem;background:#e8f5e9;border-radius:10px;padding:10px;margin-top:8px;color:#1b5e20;line-height:1.5}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#aaccff}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(200,200,255,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#c8c8ff}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:340px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
    .sum-item .val{font-size:1.8rem;font-weight:800;color:#aaccff}
    .sum-item .lbl{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:2px}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">🪞</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter">1 / 10</span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="mirror-scene">
    <p class="prop-label" id="t-prop-label"></p>
    <div class="prop-card" id="prop-card"></div>
    <div class="arrow-down">↕️</div>
    <p class="mirror-label" id="t-mirror-label"></p>
    <div class="mirrors-row" id="mirrors-row"></div>
  </div>
</div>

<div id="feedback" onclick="nextQ()">
  <div class="fb-card">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-correct" id="fb-correct"></div>
    <p style="font-size:.75rem;color:#aaa;margin-top:12px" id="t-fb-tap"></p>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>
/* TEXTOS DA INTERFACE / UI STRINGS */
const STRINGS = {
  pt: {
    pageTitle: "No Mundo da Lógica — Lição IV",
    htmlLang: "pt-BR",
    badge: "No Mundo da Lógica · Lição IV",
    title: 'Vale do<br><span>Espelho</span>',
    subtitle: "No Vale do Espelho Inversor, cada proposição vê sua própria negação. Mas qual das três reflexões é a verdadeira negação?",
    rulesTitle: "Como jogar",
    rule1: "Leia a proposição original",
    rule2: "Três reflexões aparecem no espelho",
    rule3: "Toque na negação correta",
    rule4: "Negação errada = espelho se estilhaça!",
    btnStart: "Entrar no Vale 🪞",
    backLink: "← Todas as lições",
    propLabel: "Proposição original",
    mirrorLabel: "Qual é a negação?",
    ptsLabel: "pts",
    fbTap: "Toque para continuar",
    fbOkTitle: "Reflexo correto!",
    fbNoTitle: "Espelho estilhaçado!",
    correctNegationPrefix: "Negação correta:",
    resultTitle: 'Espelho<br><span>revelado!</span>',
    maxScore: n => `de ${n} pontos`,
    correctLabel: "Acertos",
    wrongLabel: "Erros",
    btnRestart: "Jogar novamente 🔄",
    msgLow: "Continue praticando a negação! 📖",
    msgMid: "Bom esforço! Revise as regras de negação. 💪",
    msgGood: "Muito bom! Quase dominando a negação! 😊",
    msgGreat: "Reflexo perfeito! Você domina o Vale do Espelho! 🏆"
  },
  en: {
    pageTitle: "In the World of Logic — Lesson IV",
    htmlLang: "en",
    badge: "In the World of Logic · Lesson IV",
    title: 'Valley of the<br><span>Mirror</span>',
    subtitle: "In the Valley of the Inverting Mirror, every proposition meets its own negation. But which of the three reflections is the true negation?",
    rulesTitle: "How to play",
    rule1: "Read the original proposition",
    rule2: "Three reflections appear in the mirror",
    rule3: "Tap the correct negation",
    rule4: "Wrong negation = the mirror shatters!",
    btnStart: "Enter the Valley 🪞",
    backLink: "← All lessons",
    propLabel: "Original proposition",
    mirrorLabel: "Which one is the negation?",
    ptsLabel: "pts",
    fbTap: "Tap to continue",
    fbOkTitle: "Correct reflection!",
    fbNoTitle: "Mirror shattered!",
    correctNegationPrefix: "Correct negation:",
    resultTitle: 'Mirror<br><span>revealed!</span>',
    maxScore: n => `out of ${n} points`,
    correctLabel: "Correct",
    wrongLabel: "Wrong",
    btnRestart: "Play again 🔄",
    msgLow: "Keep practicing negation! 📖",
    msgMid: "Good effort! Review the rules of negation. 💪",
    msgGood: "Very good! Almost mastering negation! 😊",
    msgGreat: "Perfect reflection! You've mastered the Valley of the Mirror! 🏆"
  }
};

/* QUESTÕES / QUESTIONS (bilíngue) */
const QUESTIONS = [
  {
    prop:    { pt: "Deus Pai é o Criador do céu e da terra.", en: "God the Father is the Creator of heaven and earth." },
    correct: { pt: "Deus Pai não é o Criador do céu e da terra.", en: "God the Father is not the Creator of heaven and earth." },
    wrong: [
      { pt: "Deus Pai talvez seja o Criador do céu e da terra.", en: "God the Father might be the Creator of heaven and earth." },
      { pt: "Deus Pai pode ou não ser o Criador.", en: "God the Father may or may not be the Creator." }
    ]
  },
  {
    prop:    { pt: "Jesus Cristo não é o único Filho de Deus.", en: "Jesus Christ is not the only Son of God." },
    correct: { pt: "Jesus Cristo é o único Filho de Deus.", en: "Jesus Christ is the only Son of God." },
    wrong: [
      { pt: "Jesus Cristo talvez seja o único Filho de Deus.", en: "Jesus Christ might be the only Son of God." },
      { pt: "Jesus Cristo é mais um filho de Deus.", en: "Jesus Christ is just one more son of God." }
    ]
  },
  {
    prop:    { pt: "Jesus foi crucificado.", en: "Jesus was crucified." },
    correct: { pt: "Jesus não foi crucificado.", en: "Jesus was not crucified." },
    wrong: [
      { pt: "Jesus foi quase crucificado.", en: "Jesus was almost crucified." },
      { pt: "Não foi Jesus quem crucificou.", en: "It wasn't Jesus who crucified." }
    ]
  },
  {
    prop:    { pt: "Jesus Cristo continua morto.", en: "Jesus Christ remains dead." },
    correct: { pt: "Jesus Cristo não continua morto.", en: "Jesus Christ does not remain dead." },
    wrong: [
      { pt: "Jesus Cristo está vivo e morto ao mesmo tempo.", en: "Jesus Christ is alive and dead at the same time." },
      { pt: "Jesus Cristo talvez continue morto.", en: "Jesus Christ might still be dead." }
    ]
  },
  {
    prop:    { pt: "7 × 8 = 56", en: "7 × 8 = 56" },
    correct: { pt: "7 × 8 ≠ 56", en: "7 × 8 ≠ 56" },
    wrong: [
      { pt: "7 × 8 < 56", en: "7 × 8 < 56" },
      { pt: "7 × 8 > 56", en: "7 × 8 > 56" }
    ]
  },
  {
    prop:    { pt: "27 + 3 > 2", en: "27 + 3 > 2" },
    correct: { pt: "27 + 3 ≤ 2", en: "27 + 3 ≤ 2" },
    wrong: [
      { pt: "27 + 3 < 2", en: "27 + 3 < 2" },
      { pt: "27 + 3 ≠ 2", en: "27 + 3 ≠ 2" }
    ]
  },
  {
    prop:    { pt: "3² ≤ 9", en: "3² ≤ 9" },
    correct: { pt: "3² > 9", en: "3² > 9" },
    wrong: [
      { pt: "3² < 9", en: "3² < 9" },
      { pt: "3² ≥ 9", en: "3² ≥ 9" }
    ]
  },
  {
    prop:    { pt: "O céu está nublado.", en: "The sky is cloudy." },
    correct: { pt: "O céu não está nublado.", en: "The sky is not cloudy." },
    wrong: [
      { pt: "O céu está muito nublado.", en: "The sky is very cloudy." },
      { pt: "O céu pode estar nublado.", en: "The sky might be cloudy." }
    ]
  },
  {
    prop:    { pt: "Jesus não é Deus.", en: "Jesus is not God." },
    correct: { pt: "Jesus é Deus.", en: "Jesus is God." },
    wrong: [
      { pt: "Jesus talvez seja Deus.", en: "Jesus might be God." },
      { pt: "Jesus não pode ser Deus.", en: "Jesus cannot be God." }
    ]
  },
  {
    prop:    { pt: "4 ≠ 2²", en: "4 ≠ 2²" },
    correct: { pt: "4 = 2²", en: "4 = 2²" },
    wrong: [
      { pt: "4 < 2²", en: "4 < 2²" },
      { pt: "4 > 2²", en: "4 > 2²" }
    ]
  },
];

let LANG = 'pt';
try {
  const saved = localStorage.getItem('nml_lang');
  if (saved === 'pt' || saved === 'en') LANG = saved;
} catch (e) { /* localStorage indisponível / unavailable — mantém pt / keep default */ }

let questions, current, score, correct, wrong, currentOpts;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* IDIOMA / LANGUAGE */
function setLang(lang){
  LANG = lang;
  try { localStorage.setItem('nml_lang', lang); } catch (e) { /* ignore */ }
  applyLanguage();
}

function applyLanguage(){
  const s = STRINGS[LANG];
  document.documentElement.lang = s.htmlLang;
  document.title = s.pageTitle;

  document.getElementById('lang-btn-pt').classList.toggle('active', LANG === 'pt');
  document.getElementById('lang-btn-en').classList.toggle('active', LANG === 'en');

  document.getElementById('t-badge').textContent = s.badge;
  document.getElementById('t-title').innerHTML = s.title;
  document.getElementById('t-subtitle').innerHTML = s.subtitle;
  document.getElementById('t-rules-title').textContent = s.rulesTitle;
  document.getElementById('t-rule1').textContent = s.rule1;
  document.getElementById('t-rule2').textContent = s.rule2;
  document.getElementById('t-rule3').textContent = s.rule3;
  document.getElementById('t-rule4').textContent = s.rule4;
  document.getElementById('t-btn-start').textContent = s.btnStart;
  document.getElementById('t-back-1').textContent = s.backLink;
  document.getElementById('t-back-2').textContent = s.backLink;
  document.getElementById('t-pts-label').textContent = s.ptsLabel;
  document.getElementById('t-prop-label').textContent = s.propLabel;
  document.getElementById('t-mirror-label').textContent = s.mirrorLabel;
  document.getElementById('t-fb-tap').textContent = s.fbTap;
  document.getElementById('t-result-title').innerHTML = s.resultTitle;
  document.getElementById('t-max-score').textContent = s.maxScore(QUESTIONS.length * 100);
  document.getElementById('t-correct-label').textContent = s.correctLabel;
  document.getElementById('t-wrong-label').textContent = s.wrongLabel;
  document.getElementById('t-btn-restart').textContent = s.btnRestart;

  // Se o jogo já estiver em andamento, atualiza o conteúdo dinâmico também
  // If the game is already in progress, refresh its dynamic content too
  if (document.getElementById('screen-game').classList.contains('active') &&
      typeof questions !== 'undefined' && questions && questions[current]) {
    document.getElementById('prop-card').textContent = questions[current].prop[LANG];
    if (currentOpts) renderOpts();
  }
}

function startGame(){questions=shuffle(QUESTIONS);current=0;score=0;correct=0;wrong=0;show('screen-game');loadQ()}

function loadQ(){
  if(current>=questions.length){endGame();return}
  const q=questions[current];
  document.getElementById('prop-card').textContent=q.prop[LANG];
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('live-score').textContent=score;

  // Build shuffled options
  currentOpts=shuffle([
    {text:q.correct,isCorrect:true},
    {text:q.wrong[0],isCorrect:false},
    {text:q.wrong[1],isCorrect:false},
  ]);
  renderOpts();
}

function renderOpts(){
  const row=document.getElementById('mirrors-row');
  row.innerHTML='';
  currentOpts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='mirror-opt';
    btn.textContent=o.text[LANG];
    btn.onclick=()=>answer(btn,o.isCorrect,questions[current].correct);
    row.appendChild(btn);
  });
}

function answer(btn,isCorrect,correctTextObj){
  // disable all
  document.querySelectorAll('.mirror-opt').forEach(b=>b.onclick=null);
  if(isCorrect){
    btn.classList.add('correct');
    score+=100;correct++;
    setTimeout(()=>showFeedback(true,correctTextObj),400);
  } else {
    btn.classList.add('wrong');
    wrong++;
    setTimeout(()=>showFeedback(false,correctTextObj),500);
  }
}

function showFeedback(ok,correctTextObj){
  const s=STRINGS[LANG];
  document.getElementById('fb-icon').textContent=ok?'🪞✨':'💥';
  document.getElementById('fb-title').textContent=ok?s.fbOkTitle:s.fbNoTitle;
  document.getElementById('fb-title').className='fb-title '+(ok?'ok':'no');
  document.getElementById('fb-correct').textContent=s.correctNegationPrefix+' "'+correctTextObj[LANG]+'"';
  document.getElementById('feedback').classList.add('show');
}

function nextQ(){document.getElementById('feedback').classList.remove('show');current++;loadQ()}

function endGame(){
  const s=STRINGS[LANG];
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=wrong;
  const pct=score/(QUESTIONS.length*100);
  let stars='⭐',msg=s.msgLow;
  if(pct>=.9){stars='⭐⭐⭐';msg=s.msgGreat}
  else if(pct>=.7){stars='⭐⭐';msg=s.msgGood}
  else if(pct>=.5){stars='⭐½';msg=s.msgMid}
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-msg').textContent=msg;
}

function restartGame(){startGame()}

/* INICIALIZAÇÃO / INIT */
applyLanguage();
</script>
</body>
</html>
