<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição IX / Lesson IX</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a1a2a,#0d2a4a,#1a2a5a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff;overflow-x:hidden}
    .screen{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:16px}
    .screen.active{display:flex}

    /* LANGUAGE SWITCH */
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#c0c8ff;color:#0a1a2a}

    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(180,180,255,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#c0c8ff}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#c0c8ff}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:340px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#c0c8ff;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#c0c8ff}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#c0c8ff,#6677ee);color:#0a1a2a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(100,120,255,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#c0c8ff}

    /* DANCE FLOOR */
    .dance-hall{width:100%;background:linear-gradient(180deg,#0d0d2a 0%,#1a1a4a 50%,#0d0d2a 100%);border-radius:20px;padding:20px 16px;box-shadow:0 8px 30px rgba(0,0,100,.4);border:1px solid rgba(180,180,255,.2)}
    .hall-title{text-align:center;font-size:.75rem;color:#8888cc;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
    .tiles-row{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
    .tile{width:130px;height:100px;background:rgba(255,255,255,.08);border:2px solid rgba(180,180,255,.2);border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;transition:transform .2s;position:relative;overflow:hidden}
    .tile .tile-front,.tile .tile-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;transition:opacity .3s,transform .3s}
    .tile .tile-front{opacity:1;transform:scale(1)}
    .tile .tile-back{opacity:0;transform:scale(.8)}
    .tile.flipped .tile-front{opacity:0;transform:scale(.8)}
    .tile.flipped .tile-back{opacity:1;transform:scale(1)}
    .tile-name{font-size:.65rem;color:#8888cc;text-transform:uppercase}
    .tile-text{font-size:.72rem;font-weight:600;text-align:center;padding:0 6px;color:#fff;line-height:1.3}
    .tile-vf{font-size:2rem;font-weight:900}
    .tile-vf.v{color:#7effd4}.tile-vf.f{color:#ff8888}
    .tile-question{font-size:2.5rem;color:rgba(255,255,255,.3)}
    .biconn-sign{font-size:1.6rem;color:#c0c8ff;font-weight:900;display:flex;align-items:center}
    .result-formula{text-align:center;font-size:.95rem;font-weight:800;color:#fff;background:rgba(255,255,255,.08);border-radius:12px;padding:8px;margin-top:4px}
    .tap-hint{font-size:.72rem;color:rgba(255,255,255,.35);text-align:center;margin-top:4px}

    /* BUTTONS */
    .answer-row{width:100%;display:flex;gap:14px}
    .btn-answer{flex:1;padding:16px 10px;border:none;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:.85rem;transition:transform .1s;box-shadow:0 4px 15px rgba(0,0,0,.2)}
    .btn-answer:active{transform:scale(.95)}
    .btn-dance{background:linear-gradient(135deg,#6677ee,#4455cc);color:#fff}
    .btn-repel{background:linear-gradient(135deg,#cc4444,#aa2222);color:#fff}
    .btn-answer .icon{font-size:1.8rem}

    /* FEEDBACK */
    #feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
    #feedback.show{display:flex}
    .fb-card{background:#fff;color:#0a1a2a;border-radius:22px;padding:26px 22px;text-align:center;max-width:320px;width:100%;animation:popIn .2s ease-out}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .fb-icon{font-size:3.5rem}.fb-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px}
    .fb-title.ok{color:#4455cc}.fb-title.no{color:#cc4444}
    .fb-rule{font-size:.82rem;color:#555;background:#eeeeff;border-radius:10px;padding:10px;margin-top:8px;line-height:1.5}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#c0c8ff}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(180,180,255,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#c0c8ff}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:340px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
    .sum-item .val{font-size:1.8rem;font-weight:800;color:#c0c8ff}
    .sum-item .lbl{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:2px}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">💫</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter">1 / 10</span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="dance-hall">
    <div class="hall-title" id="t-hall-title"></div>
    <div class="tiles-row">
      <div class="tile" id="tile-p" onclick="flipTile('p')">
        <div class="tile-front">
          <span class="tile-name">p</span>
          <span class="tile-question">?</span>
          <span class="tap-sub" id="t-tap-reveal-p" style="font-size:.65rem;color:rgba(255,255,255,.3)"></span>
        </div>
        <div class="tile-back">
          <span class="tile-name">p</span>
          <div class="tile-text" id="text-p-back"></div>
          <div class="tile-vf" id="vf-p"></div>
        </div>
      </div>
      <div class="biconn-sign">↔</div>
      <div class="tile" id="tile-q" onclick="flipTile('q')">
        <div class="tile-front">
          <span class="tile-name">q</span>
          <span class="tile-question">?</span>
          <span class="tap-sub" id="t-tap-reveal-q" style="font-size:.65rem;color:rgba(255,255,255,.3)"></span>
        </div>
        <div class="tile-back">
          <span class="tile-name">q</span>
          <div class="tile-text" id="text-q-back"></div>
          <div class="tile-vf" id="vf-q"></div>
        </div>
      </div>
    </div>
    <div class="result-formula">p ↔ q = ?</div>
    <div class="tap-hint" id="t-tap-hint"></div>
  </div>
  <div class="answer-row">
    <button class="btn-answer btn-dance" id="btn-dance" onclick="answer(true)" disabled>
      <span class="icon">💃🕺</span><span id="t-dance-label"></span>
    </button>
    <button class="btn-answer btn-repel" id="btn-repel" onclick="answer(false)" disabled>
      <span class="icon">↔💥</span><span id="t-repel-label"></span>
    </button>
  </div>
</div>

<div id="feedback" onclick="nextQ()">
  <div class="fb-card">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-rule"  id="fb-rule"></div>
    <p style="font-size:.75rem;color:#aaa;margin-top:12px" id="t-fb-continue"></p>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>
/* ── TEXTOS DA INTERFACE / UI STRINGS ─────────────── */
const STRINGS = {
  pt: {
    pageTitle: "No Mundo da Lógica — Lição IX",
    htmlLang: "pt-BR",
    badge: "No Mundo da Lógica · Lição IX",
    title: 'Salão dos<br><span>Espelhos Gêmeos</span>',
    subtitle: 'A bicondicional (↔) ama a harmonia! Iguais dançam juntos (V). Diferentes se repelem (F).',
    rulesTitle: "Como jogar",
    rule1: "Toque nos cards para revelar V ou F",
    rule2: 'Se p e q forem <strong>iguais</strong> → dançam juntos (V)',
    rule3: 'Se forem <strong>diferentes</strong> → se repelem (F)',
    rule4: "Toque, pense e responda!",
    btnStart: "Entrar no Salão ✨",
    backLink: "← Todas as lições",
    hallTitle: "✨ Salão dos Espelhos Gêmeos ✨",
    tapToReveal: "toque para revelar",
    tapHint: "Revele as duas cartas antes de responder",
    ptsLabel: "pts",
    trueLetter: "V",
    falseLetter: "F",
    danceLabel: "DANÇAM JUNTOS (V)",
    repelLabel: "SE REPELEM (F)",
    fbTitleOk: "Harmonia perfeita! +100",
    fbTitleNo: "Discordância!",
    fbContinue: "Toque para continuar",
    ruleSame: (pL, qL) => `p=${pL} e q=${qL} → são iguais! Os iguais se atraem no Salão → ↔ = V. 💃`,
    ruleDiff: (pL, qL) => `p=${pL} e q=${qL} → são diferentes! Os diferentes se repelem → ↔ = F. 💥`,
    resultTitle: 'Salão<br><span>encerrado!</span>',
    maxScore: n => `de ${n} pontos`,
    correctLabel: "Acertos",
    wrongLabel: "Erros",
    btnRestart: "Jogar novamente 🔄",
    msgLow: "Continue praticando a bicondicional! 📖",
    msgMid: "Bom esforço! Lembre: ↔ é V quando p e q são iguais. 💪",
    msgGood: "Muito bom! Você domina a bicondicional! 😊",
    msgGreat: "Você é o mestre do Salão dos Espelhos Gêmeos! 🏆"
  },
  en: {
    pageTitle: "In the World of Logic — Lesson IX",
    htmlLang: "en",
    badge: "In the World of Logic · Lesson IX",
    title: 'Hall of<br><span>Twin Mirrors</span>',
    subtitle: 'The biconditional (↔) loves harmony! Equals dance together (T). Different ones repel (F).',
    rulesTitle: "How to play",
    rule1: "Tap the cards to reveal T or F",
    rule2: 'If p and q are the <strong>same</strong> → they dance together (T)',
    rule3: 'If they are <strong>different</strong> → they repel (F)',
    rule4: "Tap, think, and answer!",
    btnStart: "Enter the Hall ✨",
    backLink: "← All lessons",
    hallTitle: "✨ Hall of Twin Mirrors ✨",
    tapToReveal: "tap to reveal",
    tapHint: "Reveal both cards before answering",
    ptsLabel: "pts",
    trueLetter: "T",
    falseLetter: "F",
    danceLabel: "DANCE TOGETHER (T)",
    repelLabel: "REPEL (F)",
    fbTitleOk: "Perfect harmony! +100",
    fbTitleNo: "Disagreement!",
    fbContinue: "Tap to continue",
    ruleSame: (pL, qL) => `p=${pL} and q=${qL} → they're the same! Equals attract in the Hall → ↔ = T. 💃`,
    ruleDiff: (pL, qL) => `p=${pL} and q=${qL} → they're different! Different ones repel → ↔ = F. 💥`,
    resultTitle: 'Hall<br><span>closed!</span>',
    maxScore: n => `out of ${n} points`,
    correctLabel: "Correct",
    wrongLabel: "Wrong",
    btnRestart: "Play again 🔄",
    msgLow: "Keep practicing the biconditional! 📖",
    msgMid: "Good effort! Remember: ↔ is T when p and q are the same. 💪",
    msgGood: "Very good! You've mastered the biconditional! 😊",
    msgGreat: "You are the master of the Hall of Twin Mirrors! 🏆"
  }
};

/* ── QUESTÕES / QUESTIONS (bilíngue) ──────────────── */
const QUESTIONS=[
  {p:{pt:"Deus é Santo.",en:"God is Holy."},pV:true,  q:{pt:"Jesus ressuscitou.",en:"Jesus rose from the dead."},qV:true},
  {p:{pt:"O triângulo tem 3 lados.",en:"A triangle has 3 sides."},pV:true, q:{pt:"O sol é feito de gelo.",en:"The sun is made of ice."},qV:false},
  {p:{pt:"O pecado é bom.",en:"Sin is good."},pV:false, q:{pt:"Jesus é mentiroso.",en:"Jesus is a liar."},qV:false},
  {p:{pt:"2 + 2 = 5",en:"2 + 2 = 5"},pV:false, q:{pt:"Judas foi fiel.",en:"Judas was faithful."},qV:false},
  {p:{pt:"Deus é o Criador.",en:"God is the Creator."},pV:true, q:{pt:"Jesus não é Deus.",en:"Jesus is not God."},qV:false},
  {p:{pt:"O fogo queima.",en:"Fire burns."},pV:true, q:{pt:"A neve é quente.",en:"Snow is hot."},qV:false},
  {p:{pt:"3 + 3 = 6",en:"3 + 3 = 6"},pV:true, q:{pt:"2 × 3 = 6",en:"2 × 3 = 6"},qV:true},
  {p:{pt:"O homem pecou.",en:"Man sinned."},pV:true, q:{pt:"O homem precisa de salvação.",en:"Man needs salvation."},qV:true},
  {p:{pt:"O quadrado tem 4 lados.",en:"A square has 4 sides."},pV:true, q:{pt:"11 não é primo.",en:"11 is not prime."},qV:false},
  {p:{pt:"Moisés escreveu os Evangelhos.",en:"Moses wrote the Gospels."},pV:false, q:{pt:"Jesus nasceu em Roma.",en:"Jesus was born in Rome."},qV:false},
];

let questions,current,score,correctCount,wrongCount;
let flippedP=false,flippedQ=false,answered=false;

let LANG='pt';
try{
  const saved=localStorage.getItem('nml_lang');
  if(saved==='pt'||saved==='en')LANG=saved;
}catch(e){ /* localStorage indisponível / unavailable — mantém pt / keep default */ }

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* ── IDIOMA / LANGUAGE ───────────────────────────── */
function setLang(lang){
  LANG=lang;
  try{localStorage.setItem('nml_lang',lang)}catch(e){ /* ignore */ }
  applyChrome();
  // Se já houver uma questão carregada, atualiza o texto dela também
  // If a question is already loaded, refresh its text too
  if(typeof questions!=='undefined'&&questions&&questions[current]&&
     document.getElementById('screen-game').classList.contains('active')){
    refreshQuestionText();
  }
}

function applyChrome(){
  const s=STRINGS[LANG];
  document.documentElement.lang=s.htmlLang;
  document.title=s.pageTitle;

  document.getElementById('lang-btn-pt').classList.toggle('active',LANG==='pt');
  document.getElementById('lang-btn-en').classList.toggle('active',LANG==='en');

  document.getElementById('t-badge').textContent=s.badge;
  document.getElementById('t-title').innerHTML=s.title;
  document.getElementById('t-subtitle').textContent=s.subtitle;
  document.getElementById('t-rules-title').textContent=s.rulesTitle;
  document.getElementById('t-rule1').textContent=s.rule1;
  document.getElementById('t-rule2').innerHTML=s.rule2;
  document.getElementById('t-rule3').innerHTML=s.rule3;
  document.getElementById('t-rule4').textContent=s.rule4;
  document.getElementById('t-btn-start').textContent=s.btnStart;
  document.getElementById('t-back-1').textContent=s.backLink;
  document.getElementById('t-back-2').textContent=s.backLink;
  document.getElementById('t-hall-title').textContent=s.hallTitle;
  document.getElementById('t-tap-reveal-p').textContent=s.tapToReveal;
  document.getElementById('t-tap-reveal-q').textContent=s.tapToReveal;
  document.getElementById('t-tap-hint').textContent=s.tapHint;
  document.getElementById('t-pts-label').textContent=s.ptsLabel;
  document.getElementById('t-dance-label').textContent=s.danceLabel;
  document.getElementById('t-repel-label').textContent=s.repelLabel;
  document.getElementById('t-fb-continue').textContent=s.fbContinue;
  document.getElementById('t-result-title').innerHTML=s.resultTitle;
  document.getElementById('t-max-score').textContent=s.maxScore(QUESTIONS.length*100);
  document.getElementById('t-correct-label').textContent=s.correctLabel;
  document.getElementById('t-wrong-label').textContent=s.wrongLabel;
  document.getElementById('t-btn-restart').textContent=s.btnRestart;
}

function refreshQuestionText(){
  const s=STRINGS[LANG];
  const q=questions[current];
  document.getElementById('text-p-back').textContent=q.p[LANG];
  document.getElementById('text-q-back').textContent=q.q[LANG];
  const vfp=document.getElementById('vf-p');vfp.textContent=q.pV?s.trueLetter:s.falseLetter;
  const vfq=document.getElementById('vf-q');vfq.textContent=q.qV?s.trueLetter:s.falseLetter;
}

function startGame(){questions=shuffle(QUESTIONS);current=0;score=0;correctCount=0;wrongCount=0;show('screen-game');loadQ()}

function loadQ(){
  if(current>=questions.length){endGame();return}
  const s=STRINGS[LANG];
  const q=questions[current];
  flippedP=false;flippedQ=false;answered=false;
  document.getElementById('tile-p').className='tile';
  document.getElementById('tile-q').className='tile';
  document.getElementById('text-p-back').textContent=q.p[LANG];
  document.getElementById('text-q-back').textContent=q.q[LANG];
  const vfp=document.getElementById('vf-p');vfp.textContent=q.pV?s.trueLetter:s.falseLetter;vfp.className='tile-vf '+(q.pV?'v':'f');
  const vfq=document.getElementById('vf-q');vfq.textContent=q.qV?s.trueLetter:s.falseLetter;vfq.className='tile-vf '+(q.qV?'v':'f');
  document.getElementById('btn-dance').disabled=true;
  document.getElementById('btn-repel').disabled=true;
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('live-score').textContent=score;
}

function flipTile(which){
  if(answered)return;
  if(which==='p'&&!flippedP){flippedP=true;document.getElementById('tile-p').classList.add('flipped')}
  if(which==='q'&&!flippedQ){flippedQ=true;document.getElementById('tile-q').classList.add('flipped')}
  if(flippedP&&flippedQ){
    document.getElementById('btn-dance').disabled=false;
    document.getElementById('btn-repel').disabled=false;
  }
}

function answer(userDance){
  if(answered)return;answered=true;
  const s=STRINGS[LANG];
  document.getElementById('btn-dance').disabled=true;
  document.getElementById('btn-repel').disabled=true;
  const q=questions[current];
  const result=(q.pV===q.qV); // biconditional
  const ok=(userDance===result);
  let pts=0;
  if(ok){pts=100;score+=pts;correctCount++}else wrongCount++;
  const pL=q.pV?s.trueLetter:s.falseLetter;
  const qL=q.qV?s.trueLetter:s.falseLetter;
  let rule;
  if(q.pV===q.qV)rule=s.ruleSame(pL,qL);
  else rule=s.ruleDiff(pL,qL);
  document.getElementById('fb-icon').textContent=ok?'💫✨':'💥';
  document.getElementById('fb-title').textContent=ok?s.fbTitleOk:s.fbTitleNo;
  document.getElementById('fb-title').className='fb-title '+(ok?'ok':'no');
  document.getElementById('fb-rule').textContent=rule;
  document.getElementById('feedback').classList.add('show');
}

function nextQ(){document.getElementById('feedback').classList.remove('show');current++;loadQ()}

function endGame(){
  const s=STRINGS[LANG];
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=correctCount;
  document.getElementById('r-wrong').textContent=wrongCount;
  const pct=correctCount/QUESTIONS.length;
  let stars='⭐',msg=s.msgLow;
  if(pct>=.9){stars='⭐⭐⭐';msg=s.msgGreat}
  else if(pct>=.7){stars='⭐⭐';msg=s.msgGood}
  else if(pct>=.5){stars='⭐½';msg=s.msgMid}
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-msg').textContent=msg;
}
function restartGame(){startGame()}

/* ── INICIALIZAÇÃO / INIT ────────────────────────── */
applyChrome();
</script>
