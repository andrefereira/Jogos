<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição VII / Lesson VII</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(160deg,#0a2a4a,#0d3d6b,#1a5080);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
    .screen{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:16px}
    .screen.active{display:flex}

    /* LANGUAGE SWITCH */
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#ffd700;color:#0a2a4a}

    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(100,180,255,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#7ec8ff}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#7ec8ff}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:340px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#7ec8ff;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#7ec8ff}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#ffd700,#ffaa00);color:#0a2a4a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(255,215,0,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#ffd700}
    .timer-wrap{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
    #timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#7ec8ff,#ffd700);transition:width .1s linear;border-radius:10px}
    #timer-bar.danger{background:linear-gradient(90deg,#ff6b6b,#ff3333)}

    /* BEACH SCENE */
    .beach-scene{width:100%;background:linear-gradient(180deg,#87ceeb 0%,#87ceeb 55%,#f4d03f 55%,#f4d03f 72%,#1a6b9a 72%,#1a6b9a 100%);border-radius:20px;padding:20px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3);min-height:160px;display:flex;flex-direction:column;align-items:center;gap:8px}
    .friends-row{display:flex;gap:16px;justify-content:center;width:100%}
    .friend-card{flex:1;background:rgba(255,255,255,.9);border-radius:14px;padding:10px 8px;text-align:center;max-width:150px}
    .friend-name{font-size:.65rem;color:#666;text-transform:uppercase;letter-spacing:.5px}
    .friend-face{font-size:1.8rem;margin:4px 0}
    .friend-text{font-size:.7rem;font-weight:600;color:#1a3a5a;line-height:1.3}
    .friend-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:700;margin-top:3px}
    .badge-v{background:#d4edda;color:#155724}
    .badge-f{background:#f8d7da;color:#721c24}
    .or-sign{font-size:1.4rem;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center}
    .question-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:12px;padding:8px 12px;width:100%}
    .q-formula{font-size:1rem;font-weight:800;color:#1a3a5a}
    .q-eq{font-size:.9rem;color:#666}

    /* ANSWER BUTTONS */
    .answer-row{width:100%;display:flex;gap:14px}
    .btn-answer{flex:1;padding:18px 10px;border:none;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:.9rem;transition:transform .1s;box-shadow:0 4px 15px rgba(0,0,0,.2)}
    .btn-answer:active{transform:scale(.95)}
    .btn-answer .face{font-size:2.4rem}
    #btn-v{background:linear-gradient(135deg,#00c87a,#00a862);color:#fff}
    #btn-f{background:linear-gradient(135deg,#ff6b6b,#e0303a);color:#fff}

    /* FEEDBACK */
    #feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:20px}
    #feedback.show{display:flex}
    .fb-card{background:#fff;color:#1a3a5a;border-radius:22px;padding:26px 22px;text-align:center;max-width:320px;width:100%;animation:popIn .2s ease-out}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .fb-icon{font-size:3.5rem}.fb-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px}
    .fb-title.ok{color:#00a862}.fb-title.no{color:#e0303a}
    .fb-rule{font-size:.82rem;color:#555;background:#e8f4ff;border-radius:10px;padding:10px;margin-top:8px;line-height:1.5}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#7ec8ff}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(100,180,255,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#ffd700}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:340px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
    .sum-item .val{font-size:1.8rem;font-weight:800;color:#7ec8ff}
    .sum-item .lbl{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:2px}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">🏖️</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter">1 / 10</span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="timer-wrap"><div id="timer-bar"></div></div>
  <div class="beach-scene">
    <div class="friends-row">
      <div class="friend-card">
        <div class="friend-name">p</div>
        <div class="friend-face" id="face-p">😊</div>
        <div class="friend-text" id="text-p"></div>
        <div class="friend-badge" id="badge-p">V</div>
      </div>
      <div class="or-sign">∨</div>
      <div class="friend-card">
        <div class="friend-name">q</div>
        <div class="friend-face" id="face-q">😊</div>
        <div class="friend-text" id="text-q"></div>
        <div class="friend-badge" id="badge-q">V</div>
      </div>
    </div>
    <div class="question-row">
      <span class="q-formula">p ∨ q</span>
      <span class="q-eq">=</span>
      <span class="q-formula">?</span>
    </div>
  </div>
  <div class="answer-row">
    <button class="btn-answer" id="btn-v" onclick="answer(true)">
      <span class="face">😊</span><span id="t-true-label"></span>
    </button>
    <button class="btn-answer" id="btn-f" onclick="answer(false)">
      <span class="face">😢</span><span id="t-false-label"></span>
    </button>
  </div>
</div>

<div id="feedback" onclick="nextQ()">
  <div class="fb-card">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-rule"  id="fb-rule"></div>
    <p style="font-size:.95rem;font-weight:600;color:#777;margin-top:14px" id="t-fb-continue"></p>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>
/* TEXTOS DA INTERFACE / UI STRINGS */
const STRINGS = {
  pt: {
    pageTitle: "No Mundo da Lógica — Lição VII",
    htmlLang: "pt-BR",
    badge: "No Mundo da Lógica · Lição VII",
    title: 'Praia de<br><span>Proposia</span>',
    subtitle: "Na praia de Proposia, a disjunção (∨) é o conectivo da alegria! Basta UMA proposição ser verdadeira para a festa começar.",
    rulesTitle: "Como jogar",
    rule1: 'Veja o estado de <strong>p</strong> e <strong>q</strong> na praia',
    rule2: 'Determine: <strong>p ∨ q</strong> é Verdadeiro ou Falso?',
    rule3: 'Falsa só se <strong>AMBAS</strong> estiverem tristes (F)',
    rule4: "Cada questão vale até 100 pontos! Você tem tempo para ler e pensar.",
    btnStart: "Ir para a Praia ☀️",
    backLink: "← Todas as lições",
    ptsLabel: "pts",
    trueLabel: "VERDADEIRA",
    falseLabel: "FALSA",
    letterTrue: "V",
    letterFalse: "F",
    fbContinue: "Toque para continuar",
    resultTitle: 'De volta<br><span>à praia!</span>',
    maxScore: n => `de ${n} pontos`,
    correctLabel: "Acertos",
    wrongLabel: "Erros/Tempo",
    btnRestart: "Jogar novamente 🔄",
    timeUp: "Tempo esgotado!",
    correctFeedback: pts => `Correto! +${pts} pts`,
    wrongFeedback: "Errado!",
    ruleTrue: "Ao menos uma das proposições é verdadeira → disjunção = V! ☀️",
    ruleFalse: "Ambas as proposições são falsas → disjunção = F. 🌧️",
    msgLow: "Continue praticando a disjunção! 📖",
    msgMid: "Bom esforço! Lembre: ∨ só é F se AMBAS forem F. 💪",
    msgGood: "Muito bom! Você domina a disjunção! 😊",
    msgGreat: "A praia de Proposia está em festa por você! 🏆"
  },
  en: {
    pageTitle: "In the World of Logic — Lesson VII",
    htmlLang: "en",
    badge: "In the World of Logic · Lesson VII",
    title: 'Propositia<br><span>Beach</span>',
    subtitle: "On Propositia Beach, disjunction (∨) is the connective of joy! Just ONE proposition needs to be true for the party to start.",
    rulesTitle: "How to play",
    rule1: 'Check the state of <strong>p</strong> and <strong>q</strong> on the beach',
    rule2: 'Determine: is <strong>p ∨ q</strong> True or False?',
    rule3: 'False only if <strong>BOTH</strong> are sad (F)',
    rule4: "Each question is worth up to 100 points! You have time to read and think.",
    btnStart: "Go to the Beach ☀️",
    backLink: "← All lessons",
    ptsLabel: "pts",
    trueLabel: "TRUE",
    falseLabel: "FALSE",
    letterTrue: "T",
    letterFalse: "F",
    fbContinue: "Tap to continue",
    resultTitle: 'Back<br><span>to the beach!</span>',
    maxScore: n => `out of ${n} points`,
    correctLabel: "Correct",
    wrongLabel: "Wrong/Timeout",
    btnRestart: "Play again 🔄",
    timeUp: "Time's up!",
    correctFeedback: pts => `Correct! +${pts} pts`,
    wrongFeedback: "Wrong!",
    ruleTrue: "At least one of the propositions is true → disjunction = T! ☀️",
    ruleFalse: "Both propositions are false → disjunction = F. 🌧️",
    msgLow: "Keep practicing disjunction! 📖",
    msgMid: "Good effort! Remember: ∨ is only F when BOTH are F. 💪",
    msgGood: "Very good! You've mastered disjunction! 😊",
    msgGreat: "Propositia Beach is celebrating for you! 🏆"
  }
};

const QUESTIONS=[
  {p:{pt:"Deus é Santo.",en:"God is Holy."},pV:true,  q:{pt:"Jesus ressuscitou.",en:"Jesus rose from the dead."},qV:true},
  {p:{pt:"O triângulo tem 3 lados.",en:"The triangle has 3 sides."},pV:true,  q:{pt:"O sol é feito de gelo.",en:"The sun is made of ice."},qV:false},
  {p:{pt:"O pecado é bom.",en:"Sin is good."},pV:false, q:{pt:"Deus é o Criador.",en:"God is the Creator."},qV:true},
  {p:{pt:"2 + 2 = 5",en:"2 + 2 = 5"},pV:false, q:{pt:"Judas foi fiel.",en:"Judas was faithful."},qV:false},
  {p:{pt:"O fogo queima.",en:"Fire burns."},pV:true,  q:{pt:"A neve é quente.",en:"Snow is hot."},qV:false},
  {p:{pt:"10 + 5 ≠ 15",en:"10 + 5 ≠ 15"},pV:false, q:{pt:"2 + 2 = 3",en:"2 + 2 = 3"},qV:false},
  {p:{pt:"Jesus nasceu em Belém.",en:"Jesus was born in Bethlehem."},pV:true,  q:{pt:"A lua é feita de queijo.",en:"The moon is made of cheese."},qV:false},
  {p:{pt:"7 × 7 = 49",en:"7 × 7 = 49"},pV:true,  q:{pt:"3 é maior que 10",en:"3 is greater than 10"},qV:false},
  {p:{pt:"Adão pecou.",en:"Adam sinned."},pV:true,  q:{pt:"Maria era mãe de Jesus.",en:"Mary was the mother of Jesus."},qV:true},
  {p:{pt:"O quadrado tem 5 lados.",en:"The square has 5 sides."},pV:false, q:{pt:"O triângulo tem 4 lados.",en:"The triangle has 4 sides."},qV:false},
];

const TIME_BASE=10;   // segundos de reflexão / thinking seconds
const TIME_MIN=15;    // tempo mínimo por questão / minimum time per question
let tLimit=TIME_MIN,fbShownAt=0;
let questions,current,score,correctCount,wrongCount,timer,qStart;

/* ── TEMPO PARA RESPONDER / TIME TO ANSWER ───────────
   Tempo da questão = tempo de reflexão (base) + leitura (≈ 0,8 s por palavra,
   ritmo confortável para uma criança de 9 anos), nunca abaixo de um mínimo.
   Question time = thinking time (base) + reading (≈ 0.8 s per word,
   comfortable for a 9-year-old), never below a minimum. */
function contarPalavras(...textos){ return textos.join(' ').replace(/<[^>]*>/g,' ').trim().split(/\s+/).filter(Boolean).length; }
function tempoDaQuestao(palavras, base, minimo){ return Math.max(minimo, Math.round(base + 0.8 * palavras)); }

/* O relógio fica parado enquanto a aba/tela estiver oculta.
   The clock stays paused while the tab/screen is hidden. */
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); }
  else if (hiddenAt !== null) { qStart += Date.now() - hiddenAt; hiddenAt = null; }
});

let LANG='pt';
try{const saved=localStorage.getItem('nml_lang');if(saved==='pt'||saved==='en')LANG=saved;}catch(e){/* localStorage indisponível / unavailable */}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* IDIOMA / LANGUAGE */
function setLang(lang){
  LANG=lang;
  try{localStorage.setItem('nml_lang',lang);}catch(e){/* ignore */}
  applyChrome();
  if(typeof questions!=='undefined' && questions && questions[current] &&
     document.getElementById('screen-game').classList.contains('active')){
    refreshQuestionText();
  }
}

function applyChrome(){
  const s=STRINGS[LANG];
  document.documentElement.lang=s.htmlLang;
  document.title=s.pageTitle;
  document.getElementById('lang-btn-pt').classList.toggle('active',LANG==='pt');
  document.getElementById('lang-btn-en').classList.toggle('active',LANG==='en');
  document.getElementById('t-badge').textContent=s.badge;
  document.getElementById('t-title').innerHTML=s.title;
  document.getElementById('t-subtitle').textContent=s.subtitle;
  document.getElementById('t-rules-title').textContent=s.rulesTitle;
  document.getElementById('t-rule1').innerHTML=s.rule1;
  document.getElementById('t-rule2').innerHTML=s.rule2;
  document.getElementById('t-rule3').innerHTML=s.rule3;
  document.getElementById('t-rule4').textContent=s.rule4;
  document.getElementById('t-btn-start').textContent=s.btnStart;
  document.getElementById('t-back-1').textContent=s.backLink;
  document.getElementById('t-back-2').textContent=s.backLink;
  document.getElementById('t-pts-label').textContent=s.ptsLabel;
  document.getElementById('t-true-label').textContent=s.trueLabel;
  document.getElementById('t-false-label').textContent=s.falseLabel;
  document.getElementById('t-fb-continue').textContent=s.fbContinue;
  document.getElementById('t-result-title').innerHTML=s.resultTitle;
  document.getElementById('t-max-score').textContent=s.maxScore(QUESTIONS.length*100);
  document.getElementById('t-correct-label').textContent=s.correctLabel;
  document.getElementById('t-wrong-label').textContent=s.wrongLabel;
  document.getElementById('t-btn-restart').textContent=s.btnRestart;
}

function refreshQuestionText(){
  const q=questions[current];
  const s=STRINGS[LANG];
  document.getElementById('text-p').textContent=q.p[LANG];
  document.getElementById('text-q').textContent=q.q[LANG];
  const bp=document.getElementById('badge-p');bp.textContent=q.pV?s.letterTrue:s.letterFalse;
  const bq=document.getElementById('badge-q');bq.textContent=q.qV?s.letterTrue:s.letterFalse;
}

function startGame(){questions=shuffle(QUESTIONS);current=0;score=0;correctCount=0;wrongCount=0;show('screen-game');loadQ()}

function loadQ(){
  if(current>=questions.length){endGame();return}
  const q=questions[current];
  const s=STRINGS[LANG];
  tLimit=tempoDaQuestao(contarPalavras(q.p[LANG],q.q[LANG]),TIME_BASE,TIME_MIN);
  document.getElementById('text-p').textContent=q.p[LANG];
  document.getElementById('text-q').textContent=q.q[LANG];
  document.getElementById('face-p').textContent=q.pV?'😊':'😢';
  document.getElementById('face-q').textContent=q.qV?'😊':'😢';
  const bp=document.getElementById('badge-p');bp.textContent=q.pV?s.letterTrue:s.letterFalse;bp.className='friend-badge '+(q.pV?'badge-v':'badge-f');
  const bq=document.getElementById('badge-q');bq.textContent=q.qV?s.letterTrue:s.letterFalse;bq.className='friend-badge '+(q.qV?'badge-v':'badge-f');
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('live-score').textContent=score;
  document.getElementById('btn-v').disabled=false;
  document.getElementById('btn-f').disabled=false;
  const bar=document.getElementById('timer-bar');bar.style.width='100%';bar.classList.remove('danger');
  qStart=Date.now();
  clearInterval(timer);
  timer=setInterval(()=>{
    if(document.hidden)return;   // relógio parado / clock paused
    const e=(Date.now()-qStart)/1000,pct=Math.max(0,1-e/tLimit);
    bar.style.width=(pct*100)+'%';
    if(pct<.3)bar.classList.add('danger');
    if(e>=tLimit){clearInterval(timer);answer(null)}
  },80);
}

function answer(userV){
  clearInterval(timer);
  document.getElementById('btn-v').disabled=true;document.getElementById('btn-f').disabled=true;
  const q=questions[current];
  const s=STRINGS[LANG];
  const result=q.pV||q.qV;
  const ok=(userV===result);
  const timeout=(userV===null);
  let pts=0;
  if(ok){const e=(Date.now()-qStart)/1000;pts=Math.max(20,Math.round(100-e/tLimit*80));score+=pts;correctCount++}
  else wrongCount++;
  let rule=result?s.ruleTrue:s.ruleFalse;
  document.getElementById('fb-icon').textContent=ok?'🏖️✨':timeout?'⏱️':'🌧️';
  document.getElementById('fb-title').textContent=ok?s.correctFeedback(pts):timeout?s.timeUp:s.wrongFeedback;
  document.getElementById('fb-title').className='fb-title '+(ok?'ok':'no');
  document.getElementById('fb-rule').textContent=rule;
  document.getElementById('feedback').classList.add('show');
  fbShownAt=Date.now();
}

function nextQ(){if(Date.now()-fbShownAt<1200)return;   // ignora toque duplo sem querer / ignore accidental double-tap
  document.getElementById('feedback').classList.remove('show');current++;loadQ()}

function endGame(){
  const s=STRINGS[LANG];
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=correctCount;
  document.getElementById('r-wrong').textContent=wrongCount;
  const pct=correctCount/QUESTIONS.length;
  let stars='⭐',msg=s.msgLow;
  if(pct>=.9){stars='⭐⭐⭐';msg=s.msgGreat}
  else if(pct>=.7){stars='⭐⭐';msg=s.msgGood}
  else if(pct>=.5){stars='⭐½';msg=s.msgMid}
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-msg').textContent=msg;
}
function restartGame(){startGame()}

applyChrome();
