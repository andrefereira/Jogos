<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>No Mundo da Lógica / In the World of Logic — Lição XV / Lesson XV</title>
<style>
:root{--bg1:#1a3a2a;--bg2:#0d4f3c;--bg3:#1a5c4a;--acc:#7effd4;--acc2:#ffd700;--btn1:#ffd700;--btn2:#ffaa00;--ink:#1a3a2a;--card:#1a3a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
.screen{display:none;width:100%;max-width:480px;flex-direction:column;align-items:center;gap:14px}
.screen.active{display:flex}
.lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
.lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
.lang-btn.active{background:var(--acc2);color:var(--ink)}
.badge{background:rgba(255,255,255,.12);border:1px solid var(--acc2);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--acc2);text-align:center}
.mascot{font-size:4.5rem;animation:float 3s ease-in-out infinite}
.title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.title span{color:var(--acc)}
.subtitle{font-size:.92rem;color:rgba(255,255,255,.75);text-align:center;line-height:1.5;max-width:380px}
.rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:14px 18px;width:100%;border:1px solid rgba(255,255,255,.15)}
.rules-box h3{color:var(--acc2);font-size:.82rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.rules-box li{font-size:.86rem;color:rgba(255,255,255,.88);padding:3px 0;list-style:none;display:flex;gap:8px;line-height:1.35}
.rules-box li::before{content:'▸';color:var(--acc)}
.btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:var(--ink);border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .1s}
.btn-primary:active{transform:scale(.97)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
.counter{font-size:.82rem;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
.score-display{font-size:.95rem;font-weight:700;color:var(--acc2)}
.bar-wrap{width:100%;height:9px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;border-radius:10px}
#timer-bar{height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:10px}
#timer-bar.danger{background:linear-gradient(90deg,#ff6b6b,#ff3333)}
#stage{width:100%;display:flex;flex-direction:column;gap:12px}
.tag{font-size:.72rem;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.question-card{width:100%;background:rgba(255,255,255,.96);color:var(--card);border-radius:20px;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:110px}
.question-card .ln{font-size:1.02rem;font-weight:600;line-height:1.45;text-align:left}
.question-card .ln.concl{font-weight:800;border-top:2px solid var(--card);padding-top:6px;margin-top:2px}
.question-card .ln.center{text-align:center}
.question-card .ln.big{font-size:1.25rem;text-align:center;font-weight:800}
.question-card .ln.small{font-size:.85rem;font-weight:500;color:#555}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opts.two{flex-direction:row}
.opt{flex:1;padding:14px 12px;font-size:.98rem;font-weight:700;border:none;border-radius:16px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.25);text-align:center;line-height:1.3;transition:transform .1s,background .15s}
.opt:hover{background:rgba(255,255,255,.24)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default;opacity:.6}
.opt .em{display:block;font-size:2rem;margin-bottom:2px}

#feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:18px}
#feedback.show{display:flex}
.feedback-card{background:#fff;color:#1a2a2a;border-radius:24px;padding:24px 22px;text-align:center;max-width:380px;width:100%;animation:popIn .2s ease-out;max-height:92vh;overflow:auto}
.feedback-icon{font-size:3.6rem}
.feedback-title{font-size:1.35rem;font-weight:800;margin:6px 0 2px}
.feedback-title.correct{color:#00a862}.feedback-title.wrong{color:#e0303a}
.feedback-pts{font-size:.92rem;color:#777;margin-bottom:10px}
.feedback-pts strong{color:#1a2a2a}
.feedback-exp{font-size:.88rem;color:#444;line-height:1.55;background:#f3f3f3;border-radius:12px;padding:12px 14px;text-align:left;white-space:pre-line;margin-bottom:14px}
.feedback-card .btn-primary{padding:12px;font-size:1rem}

/* ORDER */
.slots{display:flex;flex-direction:column;gap:6px;width:100%}
.slot{display:flex;gap:8px;align-items:center;min-height:44px;border-radius:12px;padding:8px 10px;border:2px dashed rgba(255,255,255,.28);font-size:.9rem;color:rgba(255,255,255,.4);line-height:1.3}
.slot .n{flex:0 0 22px;height:22px;border-radius:50%;background:rgba(255,255,255,.15);font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.slot.ok{border:2px solid var(--acc);background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.slot.ok .n{background:var(--acc);color:var(--ink)}
.pool{display:flex;flex-direction:column;gap:8px;width:100%}
.pool .opt{font-size:.9rem;padding:11px 12px;text-align:left}
.pool .opt.shake{animation:shake .3s;background:rgba(255,80,80,.35)}

/* TABLE */
.mission{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 14px}
.mission .t{font-size:.72rem;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.mission .f{font-size:1.1rem;font-weight:800;color:var(--acc2)}
.legend{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.legend div{font-size:.78rem;color:rgba(255,255,255,.75);line-height:1.3}
.legend strong{color:var(--acc)}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{background:rgba(255,255,255,.2);padding:8px 5px;text-align:center;font-weight:700;white-space:nowrap;font-size:.8rem}
th.fixed{background:rgba(255,255,255,.1)}
td{padding:0;text-align:center;border:1px solid rgba(255,255,255,.12)}
td.fixed{background:rgba(0,0,0,.2);color:rgba(255,255,255,.75);font-weight:700;padding:8px 5px}
.cell-btn{width:100%;height:100%;min-width:44px;padding:10px 6px;background:transparent;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:.9rem;font-weight:800}
.cell-btn:hover{background:rgba(255,255,255,.1)}
.cell-btn.sv{background:rgba(0,200,120,.22);color:#7effd4}
.cell-btn.sf{background:rgba(255,120,120,.2);color:#ffb0b0}
.cell-btn.correct{background:rgba(0,200,120,.42)!important;color:#eafff6!important;cursor:default}
.cell-btn.wrong{background:rgba(255,80,80,.4)!important;animation:shake .3s}
.hint{font-size:.75rem;color:rgba(255,255,255,.45);text-align:center}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 18px;border-radius:20px;font-size:1rem;font-weight:600;text-align:center;width:max-content;max-width:90vw;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* RESULT */
#screen-result{text-align:center}
.result-header{font-size:1.8rem;font-weight:800;line-height:1.2}
.result-header span{color:var(--acc)}
.result-score-box{background:rgba(255,255,255,.12);border:2px solid var(--acc2);border-radius:20px;padding:22px;width:100%}
.big-score{font-size:3.4rem;font-weight:900;color:var(--acc2);line-height:1}
.max-score{font-size:.9rem;color:rgba(255,255,255,.6);margin-top:4px}
.result-stars{font-size:2.4rem}
.result-msg{font-size:1rem;color:rgba(255,255,255,.85);line-height:1.5;max-width:360px}
.summary-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
.summary-item .val{font-size:1.8rem;font-weight:800;color:var(--acc)}
.summary-item .lbl{font-size:.75rem;color:rgba(255,255,255,.65);margin-top:2px}
.back{color:rgba(255,255,255,.6);font-size:.85rem;text-decoration:none;margin-top:4px}
</style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div class="mascot">😄</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box"><h3 id="t-rules-title"></h3><ul>
    <li id="t-rule1"></li><li id="t-rule2"></li><li id="t-rule3"></li><li id="t-rule4"></li>
  </ul></div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a class="back" href="index.html" id="t-back"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter"></span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="bar-wrap" id="progress-wrap"><div id="progress-bar"></div></div>
  <div class="bar-wrap" id="timer-wrap" style="display:none"><div id="timer-bar"></div></div>
  <div id="stage"></div>
</div>

<div id="feedback"><div class="feedback-card">
  <div class="feedback-icon" id="fb-icon"></div>
  <div class="feedback-title" id="fb-title"></div>
  <div class="feedback-pts" id="fb-pts"></div>
  <div class="feedback-exp" id="fb-exp"></div>
  <button class="btn-primary" id="fb-next"></button>
</div></div>
<div id="toast"></div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div class="result-stars" id="result-stars"></div>
  <div class="result-score-box"><div class="big-score" id="final-score">0</div><div class="max-score" id="max-score"></div></div>
  <p class="result-msg" id="result-msg"></p>
  <div class="summary-grid">
    <div class="summary-item"><div class="val" id="res-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="summary-item"><div class="val" id="res-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="startGame()"></button>
  <a class="back" href="index.html" id="t-back2"></a>
</div>

<script>

    ptsZero: "<strong>+0 points</strong>",

    orderHint: "Tap the sentences in the right order",

    tableCompleteToast: "🎉 Table complete! +50",

const CFG = {

    {type:"table", formula:"(p ∧ q) → p",

      exp:{pt:"Tem a forma p ∨ q com duas proposições diferentes. Se não chove e não está frio, ela é falsa. Não é tautologia.",
           en:"It has the form p ∨ q with two different propositions. If it's not raining and not cold, it's false. Not a tautology."},
      fix:true}
  ]
};

/* ── IDIOMA / LANGUAGE ───────────────────────────── */
let LANG = 'pt';
try { const saved = localStorage.getItem('nml_lang'); if (saved === 'pt' || saved === 'en') LANG = saved; } catch(e){}
function tr(v){ return (v && typeof v === 'object' && (('pt' in v) || ('en' in v))) ? v[LANG] : v; }
function TLabel(){ return UI[LANG].trueLabel; }

function setLang(lang){
  LANG = lang;
  try { localStorage.setItem('nml_lang', lang); } catch(e){}
  applyChrome();
  // re-renderiza a tela atual, se o jogo já tiver começado
  if (document.getElementById('screen-game').classList.contains('active') && typeof items !== 'undefined' && items) {
    next(true);
  }
}

function applyChrome(){
  const s = UI[LANG];
  document.documentElement.lang = s.htmlLang;
  document.title = s.pageTitle;
  $('lang-btn-pt').classList.toggle('active', LANG==='pt');
  $('lang-btn-en').classList.toggle('active', LANG==='en');
  $('t-badge').textContent = s.badge;
  $('t-title').innerHTML = s.title;
  $('t-subtitle').textContent = s.subtitle;
  $('t-rules-title').textContent = s.rulesTitle;
  $('t-rule1').textContent = s.rule1;
  $('t-rule2').textContent = s.rule2;
  $('t-rule3').textContent = s.rule3;
  $('t-rule4').textContent = s.rule4;
  $('t-btn-start').textContent = s.btnStart;
  $('t-back').textContent = s.back;
  $('t-back2').textContent = s.back;
  $('t-pts-label').textContent = s.ptsLabel;
  $('fb-next').textContent = s.fbNext;
  $('t-result-title').innerHTML = s.resultTitle;
  $('t-correct-label').textContent = s.correctLabel;
  $('t-wrong-label').textContent = s.wrongLabel;
  $('t-btn-restart').textContent = s.btnRestart;
}

let items, idx, score, right, wrong, timerInt, tStart, maxScore, curTimer;
const $ = id => document.getElementById(id);
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}

function itemMax(it){ if(it.type==='table'){return it.rows.length*(it.headers.length-it.fixed.length)*10+50} return 100 }

function startGame(){
  items = CFG.shuffle ? shuffle(CFG.items) : CFG.items.slice();
  if(CFG.pick && items.length>CFG.pick) items = items.slice(0,CFG.pick);
  maxScore = items.reduce((s,it)=>s+itemMax(it),0);
  idx=0; score=0; right=0; wrong=0;
  show('screen-game'); next();
}
function next(redrawOnly){
  clearInterval(timerInt);
  if(idx>=items.length){ endGame(); return }
  const it = items[idx];
  $('counter').textContent = (it.type==='table'?UI[LANG].tableWord:UI[LANG].challengeWord)+(idx+1)+' / '+items.length;
  $('live-score').textContent = score;
  $('progress-bar').style.width = (idx/items.length*100)+'%';
  const stage = $('stage'); stage.innerHTML='';
  $('timer-wrap').style.display='none';
  if(it.type==='choice') renderChoice(it,stage);
  else if(it.type==='order') renderOrder(it,stage);
  else renderTable(it,stage);
}
function lines(container,text){
  text.split('\n').forEach(l=>{
    let cls='ln';
    if(l.startsWith('§c ')){cls+=' center';l=l.slice(3)}
    if(l.startsWith('§b ')){cls+=' big';l=l.slice(3)}
    if(l.startsWith('§s ')){cls+=' small';l=l.slice(3)}
    if(l.startsWith('∴')) cls+=' concl';
    container.appendChild(el('div',cls,l));
  });
}
/* ---------- feedback ---------- */
function feedback(ok, timeout, pts, exp, done){
  const s = UI[LANG];
  $('fb-icon').textContent = timeout?'⏱️':(ok?'😊':'🤔');
  const t=$('fb-title'); t.textContent = timeout?s.timeUp:(ok?s.wellDone:s.almostThere); t.className='feedback-title '+(ok?'correct':'wrong');
  $('fb-pts').innerHTML = ok?s.ptsEarned(pts):s.ptsZero;
  $('fb-exp').textContent = exp;
  $('feedback').classList.add('show');
  $('fb-next').onclick = ()=>{ $('feedback').classList.remove('show'); done(); };
}
/* ---------- choice ---------- */
function renderChoice(it,stage){
  const secs = it.t || CFG.timer;
  if(it.label) stage.appendChild(el('div','tag',tr(it.label)));
  const card = el('div','question-card'); lines(card,tr(it.q)); stage.appendChild(card);
  let opts = it.opts.map((t,i)=>({t:tr(t),ok:i===it.a}));
  if(!it.fix) opts = shuffle(opts);
  const box = el('div','opts'+((opts.length===2&&opts.every(o=>o.t.length<26))?' two':''));
  opts.forEach(o=>{
    const b = el('button','opt');
    if(o.t.startsWith('§e ')){ const parts=o.t.slice(3).split('|'); b.appendChild(el('span','em',parts[0])); b.appendChild(document.createTextNode(parts[1])); }
    else b.textContent=o.t;
    b.onclick=()=>{ clearInterval(timerInt); box.querySelectorAll('button').forEach(x=>x.disabled=true); resolveChoice(it,o.ok,false,tStart?(Date.now()-tStart)/1000:0,secs) };
    box.appendChild(b);
  });
  stage.appendChild(box);
  if(secs){
    $('timer-wrap').style.display='block'; const bar=$('timer-bar'); bar.style.width='100%'; bar.classList.remove('danger');
    tStart=Date.now();
    timerInt=setInterval(()=>{
      const el_=(Date.now()-tStart)/1000, pct=Math.max(0,1-el_/secs);
      bar.style.width=(pct*100)+'%'; bar.classList.toggle('danger',pct<.3);
      if(el_>=secs){ clearInterval(timerInt); box.querySelectorAll('button').forEach(x=>x.disabled=true); resolveChoice(it,false,true,secs,secs) }
    },80);
  } else tStart=0;
}
function resolveChoice(it,ok,timeout,elapsed,secs){
  let pts=0;
  if(ok){ pts = secs? Math.max(30,Math.round(100-(elapsed/secs)*70)) : 100; score+=pts; right++ } else wrong++;
  $('live-score').textContent=score;
  feedback(ok,timeout,pts,tr(it.exp),()=>{idx++;next()});
}
/* ---------- order ---------- */
function renderOrder(it,stage){
  const card = el('div','question-card'); lines(card,tr(it.q)); stage.appendChild(card);
  const slots = el('div','slots'); stage.appendChild(slots);
  const steps = it.steps.map(tr);
  const slotEls = steps.map((s,i)=>{ const d=el('div','slot'); d.appendChild(el('span','n',String(i+1))); const t=el('span','tx','…'); d.appendChild(t); slots.appendChild(d); return d });
  const pool = el('div','pool'); stage.appendChild(pool);
  stage.appendChild(el('div','hint',UI[LANG].orderHint));
  let placed=0, errs=0; const usedSet=new Set();
  shuffle(steps).forEach(s=>{
    const b=el('button','opt',s);
    b.onclick=()=>{
      const fr = it.free||0; const used = steps.slice(0,fr).filter(x=>usedSet.has(x));
      const okStep = (placed<fr) ? (steps.indexOf(s)>=0 && steps.indexOf(s)<fr && !usedSet.has(s)) : (s===steps[placed]);
      if(okStep){
        usedSet.add(s);
        const d=slotEls[placed]; d.classList.add('ok'); d.querySelector('.tx').textContent=s; b.remove(); placed++;
        if(placed===steps.length){
          const pts=Math.max(20,100-25*errs); score+=pts; if(errs===0) right++; else wrong++;
          $('live-score').textContent=score;
          setTimeout(()=>feedback(true,false,pts,tr(it.exp),()=>{idx++;next()}),400);
        }
      } else {
        errs++; b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),350); toast(UI[LANG].orderToast);
      }
    };
    pool.appendChild(b);
  });
}
/* ---------- table ---------- */
let cellDone, cellTotal, cellWrongOnce;
function renderTable(it,stage){
  const m=el('div','mission'); m.appendChild(el('div','t',UI[LANG].missionLabel)); m.appendChild(el('div','f',it.formula));
  if(it.legend&&it.legend.length){ const lg=el('div','legend'); it.legend.forEach(l=>{const d=el('div'); const s=el('strong',null,l.k+': '); d.appendChild(s); d.appendChild(document.createTextNode(tr(l.t))); lg.appendChild(d)}); m.appendChild(lg) }
  stage.appendChild(m);
  const wrap=el('div','table-wrap'); const tb=el('table'); wrap.appendChild(tb); stage.appendChild(wrap);
  const hr=el('tr'); it.headers.forEach((h,i)=>{const th=el('th',it.fixed.includes(i)?'fixed':'',h); hr.appendChild(th)});
  const thead=el('thead'); thead.appendChild(hr); tb.appendChild(thead);
  const tbody=el('tbody'); tb.appendChild(tbody);
  cellDone=0; cellTotal=it.rows.length*(it.headers.length-it.fixed.length); cellWrongOnce={};
  it.rows.forEach((row,ri)=>{
    const tr_=el('tr');
    row.forEach((v,ci)=>{
      const td=el('td');
      if(it.fixed.includes(ci)){ td.className='fixed'; td.textContent=v?TLabel():'F' }
      else{
        const b=el('button','cell-btn','—'); const key=ri+'-'+ci; let state=null;
        b.onclick=()=>{
          if(b.classList.contains('correct')) return;
          state = (state===null || state===false) ? true : false;
          b.textContent = state?TLabel():'F'; b.className='cell-btn '+(state?'sv':'sf');
          if(state===v){
            b.classList.add('correct'); const p=cellWrongOnce[key]?5:10; score+=p; cellDone++;
            $('live-score').textContent=score; toast(UI[LANG].cellToast(p));
            if(cellDone===cellTotal){ if(Object.keys(cellWrongOnce).length===0) right++; else wrong++; score+=50; $('live-score').textContent=score; toast(UI[LANG].tableCompleteToast); setTimeout(()=>{ if(it.exp){feedback(true,false,50,tr(it.exp),()=>{idx++;next()})} else {idx++;next()} },1500) }
          } else { if(!cellWrongOnce[key]){cellWrongOnce[key]=1} b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),350) }
        };
        td.appendChild(b);
      }
      tr_.appendChild(td);
    });
    tbody.appendChild(tr_);
  });
  stage.appendChild(el('div','hint',UI[LANG].tableHint));
}
let toastT; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000)}
/* ---------- fim ---------- */
function endGame(){
  const s = UI[LANG];
  clearInterval(timerInt); show('screen-result');
  $('progress-bar').style.width='100%';
  $('final-score').textContent=score; $('max-score').textContent=s.maxScore(maxScore);
  $('res-correct').textContent=right; $('res-wrong').textContent=wrong;
  const pct=score/maxScore; let stars='⭐', msg=s.msgLow(tr(CFG.revise));
  if(pct>=.9){stars='⭐⭐⭐'; msg=tr(CFG.win)}
  else if(pct>=.7){stars='⭐⭐'; msg=s.msgMid()}
  else if(pct>=.5){stars='⭐½'; msg=s.msgOk(tr(CFG.revise))}
  $('result-stars').textContent=stars; $('result-msg').textContent=msg;
}

/* ── INIT ─────────────────────────────────────────── */
applyChrome();
</script>
