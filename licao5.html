<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição V / Lesson V</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#2a1a3a,#3a0d4f,#4a1a5c);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
    .screen{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:16px}
    .screen.active{display:flex}

    /* LANGUAGE SWITCH */
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#e8aaff;color:#2a1a3a}

    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(220,180,255,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#ddb6ff}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#e8aaff}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:340px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#ddb6ff;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#e8aaff}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#ddb6ff,#aa66ee);color:#1a0a2a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(200,100,255,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#ddb6ff}
    .timer-wrap{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
    #timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#e8aaff,#ddb6ff);transition:width .1s linear;border-radius:10px}
    #timer-bar.danger{background:linear-gradient(90deg,#ff6b6b,#ff3333)}

    .prop-display{width:100%;background:rgba(255,255,255,.95);color:#1a0a2a;border-radius:18px;padding:20px;min-height:110px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    .prop-text{font-size:.95rem;font-weight:600;line-height:1.5;color:#1a0a2a}
    .prop-text .highlight{background:#fff3cd;padding:0 4px;border-radius:4px;color:#b45309;font-weight:700}
    .slot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .slot-label{font-size:.8rem;color:#666}
    .slot-box{display:inline-flex;align-items:center;justify-content:center;width:52px;height:38px;background:#f0e8ff;border:2px dashed #aa66ee;border-radius:10px;font-size:1.2rem;font-weight:700;color:#aa66ee}
    .slot-box.filled{background:#aa66ee;border:2px solid #aa66ee;color:#fff}

    .symbols-grid{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .sym-btn{padding:14px 4px;background:rgba(255,255,255,.12);border:2px solid rgba(220,180,255,.3);border-radius:14px;color:#fff;font-size:1.4rem;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;display:flex;flex-direction:column;align-items:center;gap:3px}
    .sym-btn span.name{font-size:.58rem;color:rgba(255,255,255,.6);font-weight:400;letter-spacing:.3px}
    .sym-btn:active{transform:scale(.93)}
    .sym-btn.correct{background:rgba(0,200,120,.3);border-color:#00c878}
    .sym-btn.wrong{background:rgba(255,80,80,.3);border-color:#ff5050;animation:wobble .35s ease}
    @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

    /* FEEDBACK */
    #feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
    #feedback.show{display:flex}
    .fb-card{background:#fff;color:#1a0a2a;border-radius:22px;padding:26px 22px;text-align:center;max-width:320px;width:100%;animation:popIn .2s ease-out}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .fb-icon{font-size:3.5rem}.fb-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px}
    .fb-title.ok{color:#00a862}.fb-title.no{color:#e0303a}
    .fb-info{font-size:.82rem;color:#555;background:#f5f0ff;border-radius:10px;padding:10px;margin-top:8px;line-height:1.5}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#e8aaff}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(220,180,255,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#ddb6ff}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:340px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
    .sum-item .val{font-size:1.8rem;font-weight:800;color:#e8aaff}
    .sum-item .lbl{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:2px}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">🔗</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter">1 / 10</span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="timer-wrap"><div id="timer-bar"></div></div>
  <div class="prop-display">
    <div class="prop-text" id="prop-text"></div>
    <div class="slot-row">
      <span class="slot-label" id="t-slot-label"></span>
      <div class="slot-box" id="slot-box">?</div>
      <span id="conn-name" style="font-size:.8rem;color:#666"></span>
    </div>
  </div>
  <div class="symbols-grid" id="symbols-grid">
    <button class="sym-btn" onclick="answer('∧')"><span>∧</span><span class="name" id="t-sym-and"></span></button>
    <button class="sym-btn" onclick="answer('∨')"><span>∨</span><span class="name" id="t-sym-or"></span></button>
    <button class="sym-btn" onclick="answer('→')"><span>→</span><span class="name" id="t-sym-if"></span></button>
    <button class="sym-btn" onclick="answer('↔')"><span>↔</span><span class="name" id="t-sym-iff"></span></button>
    <button class="sym-btn" onclick="answer('¬')"><span>¬</span><span class="name" id="t-sym-not"></span></button>
  </div>
</div>

<div id="feedback" onclick="nextQ()">
  <div class="fb-card">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-info"  id="fb-info"></div>
    <p style="font-size:.95rem;font-weight:600;color:#777;margin-top:14px" id="t-tap-continue"></p>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>

    msgGood: "Very good! You know the connectives well! 😊",
    msgGreat: "Master connective hunter! 🏆"
  }
};

/* ── QUESTÕES / QUESTIONS (bilíngue) ──────────────── */
// text: HTML with <span class="highlight">keyword</span>
const QUESTIONS = [
  {
    text: {
      pt: 'O céu proclama a glória de Deus <span class="highlight">e</span> o firmamento anuncia as obras de Suas mãos.',
      en: 'The heavens declare the glory of God <span class="highlight">and</span> the sky above proclaims his handiwork.'
    },
    sym: '∧',
    info: {
      pt: 'A palavra "e" indica conjunção (∧). Ambas as partes precisam ser verdadeiras.',
      en: 'The word "and" indicates conjunction (∧). Both parts need to be true.'

  },
  {
    text: {
      pt: '<span class="highlight">Se</span> o número é par, <span class="highlight">então</span> ele é divisível por dois.',

    },

      en: 'We will go to church <span class="highlight">or</span> we will stay home studying the Bible.'
    },
    sym: '∨',
    info: {

      en: 'The word "or" indicates disjunction (∨). It is enough for one of the parts to be true.'
    }
  },
  {
    text: {

    }
  },

    },
    sym: '∧',

  },
  {

      pt: '<span class="highlight">Se</span> confessarmos os nossos pecados, <span class="highlight">então</span> Ele é fiel e justo para perdoar.',
      en: '<span class="highlight">If</span> we confess our sins, <span class="highlight">then</span> he is faithful and just to forgive us.'
    },
    sym: '→',

      pt: '"Se... então..." é o conectivo condicional (→). 1 João 1:9!',
      en: '"If... then..." is the conditional connective (→). 1 John 1:9!'

  },
  {
    text: {

  {

    },
    sym: '↔',
    info: {
      pt: '"Se e somente se" é a bicondicional (↔). Ambas as partes são verdadeiras, então ↔ é V!',
      en: '"If and only if" is the biconditional (↔). Both parts are true, so ↔ is T!'
    }
  },
  {
    text: {
      pt: '<span class="highlight">Se</span> somos filhos, <span class="highlight">então</span> somos também herdeiros.',
      en: '<span class="highlight">If</span> we are children, <span class="highlight">then</span> we are also heirs.'
    },
    sym: '→',
    info: {
      pt: '"Se... então..." é a condicional (→). Romanos 8:17!',
      en: '"If... then..." is the conditional (→). Romans 8:17!'
    }
  },
];

const TIME_BASE=10;   // segundos de reflexão / thinking seconds
const TIME_MIN=16;    // tempo mínimo por questão / minimum time per question
const MAX_PTS=100;
let tLimit=TIME_MIN,fbShownAt=0;
let questions,current,score,correctCount,wrongCount,timer;

/* ── TEMPO PARA RESPONDER / TIME TO ANSWER ───────────
   Tempo da questão = tempo de reflexão (base) + leitura (≈ 0,8 s por palavra,
   ritmo confortável para uma criança de 9 anos), nunca abaixo de um mínimo.
   Question time = thinking time (base) + reading (≈ 0.8 s per word,
   comfortable for a 9-year-old), never below a minimum. */
function contarPalavras(...textos){ return textos.join(' ').replace(/<[^>]*>/g,' ').trim().split(/\s+/).filter(Boolean).length; }
function tempoDaQuestao(palavras, base, minimo){ return Math.max(minimo, Math.round(base + 0.8 * palavras)); }

/* O relógio fica parado enquanto a aba/tela estiver oculta.
   The clock stays paused while the tab/screen is hidden. */
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); }
  else if (hiddenAt !== null) { qStart += Date.now() - hiddenAt; hiddenAt = null; }
});

let LANG='pt';
try{
  const saved=localStorage.getItem('nml_lang');
  if(saved==='pt'||saved==='en')LANG=saved;
}catch(e){ /* localStorage indisponível / unavailable — mantém pt / keep default */ }

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* ── IDIOMA / LANGUAGE ───────────────────────────── */
function setLang(lang){
  LANG=lang;
  try{localStorage.setItem('nml_lang',lang);}catch(e){ /* ignore */ }
  applyChrome();
  // Se já houver uma questão carregada, atualiza o texto dela também
  // If a question is already loaded, refresh its text too
  if(typeof questions!=='undefined'&&questions&&questions[current]&&
     document.getElementById('screen-game').classList.contains('active')){
    document.getElementById('prop-text').innerHTML=questions[current].text[LANG];
    document.getElementById('conn-name').textContent=
      document.getElementById('slot-box').classList.contains('filled')
        ? STRINGS[LANG].connName[questions[current].sym] : '';
  }
}

function applyChrome(){
  const s=STRINGS[LANG];
  document.documentElement.lang=s.htmlLang;
  document.title=s.pageTitle;

  document.getElementById('lang-btn-pt').classList.toggle('active',LANG==='pt');
  document.getElementById('lang-btn-en').classList.toggle('active',LANG==='en');

  document.getElementById('t-badge').textContent=s.badge;
  document.getElementById('t-title').innerHTML=s.title;
  document.getElementById('t-subtitle').textContent=s.subtitle;
  document.getElementById('t-rules-title').textContent=s.rulesTitle;
  document.getElementById('t-rule1').textContent=s.rule1;
  document.getElementById('t-rule2').textContent=s.rule2;
  document.getElementById('t-rule3').textContent=s.rule3;
  document.getElementById('t-rule4').textContent=s.rule4;
  document.getElementById('t-btn-start').textContent=s.btnStart;
  document.getElementById('t-back-1').textContent=s.backLink;
  document.getElementById('t-back-2').textContent=s.backLink;
  document.getElementById('t-pts-label').textContent=s.ptsLabel;
  document.getElementById('t-slot-label').textContent=s.slotLabel;
  document.getElementById('t-sym-and').textContent=s.symAnd;
  document.getElementById('t-sym-or').textContent=s.symOr;
  document.getElementById('t-sym-if').textContent=s.symIf;
  document.getElementById('t-sym-iff').textContent=s.symIff;
  document.getElementById('t-sym-not').textContent=s.symNot;
  document.getElementById('t-tap-continue').textContent=s.tapContinue;
  document.getElementById('t-result-title').innerHTML=s.resultTitle;
  document.getElementById('t-max-score').textContent=s.maxScore(QUESTIONS.length*MAX_PTS);
  document.getElementById('t-correct-label').textContent=s.correctLabel;
  document.getElementById('t-wrong-label').textContent=s.wrongLabel;
  document.getElementById('t-btn-restart').textContent=s.btnRestart;
}

function startGame(){questions=shuffle(QUESTIONS);current=0;score=0;correctCount=0;wrongCount=0;show('screen-game');loadQ()}

let qStart;
function loadQ(){
  if(current>=questions.length){endGame();return}
  const q=questions[current];
  document.getElementById('prop-text').innerHTML=q.text[LANG];
  tLimit=tempoDaQuestao(contarPalavras(q.text[LANG]),TIME_BASE,TIME_MIN);
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('live-score').textContent=score;
  document.getElementById('slot-box').textContent='?';
  document.getElementById('slot-box').className='slot-box';
  document.getElementById('conn-name').textContent='';
  document.querySelectorAll('.sym-btn').forEach(b=>{b.className='sym-btn';b.disabled=false});
  const bar=document.getElementById('timer-bar');
  bar.style.width='100%';bar.classList.remove('danger');
  qStart=Date.now();
  clearInterval(timer);
  timer=setInterval(()=>{
    if(document.hidden)return;   // relógio parado / clock paused
    const e=(Date.now()-qStart)/1000;
    const pct=Math.max(0,1-e/tLimit);
    bar.style.width=(pct*100)+'%';
    if(pct<.3)bar.classList.add('danger');
    if(e>=tLimit){clearInterval(timer);answer(null)}
  },80);
}

function answer(sym){
  clearInterval(timer);
  document.querySelectorAll('.sym-btn').forEach(b=>b.disabled=true);
  const q=questions[current];
  const elapsed=(Date.now()-qStart)/1000;
  const ok=(sym===q.sym);
  const timeout=(sym===null);
  let pts=0;
  if(ok){pts=Math.max(20,Math.round(100-elapsed/tLimit*80));score+=pts;correctCount++}
  else{wrongCount++}
  // Highlight button
  const syms=['∧','∨','→','↔','¬'];
  document.querySelectorAll('.sym-btn').forEach((b,i)=>{
    if(syms[i]===q.sym)b.classList.add('correct');
    else if(sym&&syms[i]===sym)b.classList.add('wrong');
  });
  // Fill slot
  const slot=document.getElementById('slot-box');
  slot.textContent=q.sym;slot.className='slot-box filled';
  document.getElementById('conn-name').textContent=STRINGS[LANG].connName[q.sym];
  setTimeout(()=>{
    const s=STRINGS[LANG];
    document.getElementById('fb-icon').textContent=ok?'🔗✨':timeout?'⏱️':'❌';
    document.getElementById('fb-title').textContent=ok?s.correctFeedback(pts):timeout?s.timeUp:s.wrongFeedback;
    document.getElementById('fb-title').className='fb-title '+(ok?'ok':'no');
    document.getElementById('fb-info').textContent=q.info[LANG];
    document.getElementById('feedback').classList.add('show');
    fbShownAt=Date.now();
  },400);
}

function nextQ(){if(Date.now()-fbShownAt<1200)return;   // ignora toque duplo sem querer / ignore accidental double-tap
  document.getElementById('feedback').classList.remove('show');current++;loadQ()}

function endGame(){
  const s=STRINGS[LANG];
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=correctCount;
  document.getElementById('r-wrong').textContent=wrongCount;
  const pct=score/(QUESTIONS.length*MAX_PTS);
  let stars='⭐',msg=s.msgLow;
  if(pct>=.9){stars='⭐⭐⭐';msg=s.msgGreat}
  else if(pct>=.7){stars='⭐⭐';msg=s.msgGood}
  else if(pct>=.5){stars='⭐½';msg=s.msgMid}
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-msg').textContent=msg;
}
function restartGame(){startGame()}

/* ── INICIALIZAÇÃO / INIT ────────────────────────── */
applyChrome();
</script>
