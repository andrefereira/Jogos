<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Mundo da Lógica / In the World of Logic — Lição VIII / Lesson VIII</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#2a1a0a,#4a2a0a,#3a1a1a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff}
    .screen{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:16px}
    .screen.active{display:flex}

    /* LANGUAGE SWITCH */
    .lang-switch{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:50px;padding:4px}
    .lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:50px;cursor:pointer;transition:background .15s,color .15s}
    .lang-btn.active{background:#ffcc88;color:#2a1a0a}

    .badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,180,100,.4);border-radius:50px;padding:5px 16px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:#ffb464}
    .title{font-size:1.9rem;font-weight:800;text-align:center;line-height:1.15}
    .title span{color:#ffcc88}
    .subtitle{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.5;max-width:340px}
    .rules-box{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;width:100%;border:1px solid rgba(255,255,255,.15)}
    .rules-box h3{color:#ffb464;font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
    .rules-box li{font-size:.85rem;color:rgba(255,255,255,.85);padding:3px 0;list-style:none;display:flex;gap:8px}
    .rules-box li::before{content:'▸';color:#ffcc88}
    .btn-primary{width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#ffcc88,#ff9933);color:#2a1a0a;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(255,180,50,.4)}
    .btn-primary:active{transform:scale(.97)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* GAME */
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center}
    .counter{font-size:.82rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px}
    .score-display{font-size:.95rem;font-weight:700;color:#ffcc88}
    .timer-wrap{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
    #timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#ffcc88,#ff9933);transition:width .1s linear;border-radius:10px}
    #timer-bar.danger{background:linear-gradient(90deg,#ff6b6b,#ff3333)}

    /* SCENARIO CARD */
    .scenario-card{width:100%;background:rgba(255,255,255,.95);color:#2a1a0a;border-radius:20px;padding:20px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    .sc-title{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .sc-cond{background:#fff3e0;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.88rem}
    .sc-cond-label{font-size:.7rem;color:#b45309;font-weight:700;text-transform:uppercase;margin-bottom:3px}
    .sc-row{display:flex;gap:8px;align-items:center}
    .sc-prop{flex:1;background:#f5f5f5;border-radius:8px;padding:8px;font-size:.82rem;font-weight:600}
    .sc-prop-label{font-size:.65rem;color:#999;margin-bottom:2px}
    .sc-status{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:1.2rem;flex-shrink:0}
    .s-true{background:#d4edda}
    .s-false{background:#f8d7da}
    .sc-formula{text-align:center;font-size:.9rem;font-weight:800;color:#4a2a0a;margin-top:8px;padding:6px;background:#fffde7;border-radius:8px}

    /* BUTTONS */
    .answer-row{width:100%;display:flex;gap:14px}
    .btn-answer{flex:1;padding:16px 10px;border:none;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:.82rem;transition:transform .1s;box-shadow:0 4px 15px rgba(0,0,0,.2)}
    .btn-answer:active{transform:scale(.95)}
    .btn-answer .icon{font-size:2rem}
    .btn-kept{background:linear-gradient(135deg,#00c87a,#00a862);color:#fff}
    .btn-broken{background:linear-gradient(135deg,#ff6b6b,#e0303a);color:#fff}

    /* FEEDBACK */
    #feedback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:20px}
    #feedback.show{display:flex}
    .fb-card{background:#fff;color:#2a1a0a;border-radius:22px;padding:26px 22px;text-align:center;max-width:320px;width:100%;animation:popIn .2s ease-out}
    @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .fb-icon{font-size:3.5rem}.fb-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px}
    .fb-title.ok{color:#00a862}.fb-title.no{color:#e0303a}
    .fb-rule{font-size:.82rem;color:#555;background:#fff8e1;border-radius:10px;padding:10px;margin-top:8px;line-height:1.5}

    /* RESULT */
    #screen-result{text-align:center}
    .result-header{font-size:1.8rem;font-weight:800}
    .result-header span{color:#ffcc88}
    .score-box{background:rgba(255,255,255,.12);border:2px solid rgba(255,180,100,.4);border-radius:20px;padding:24px;width:100%}
    .big-score{font-size:3.5rem;font-weight:900;color:#ffcc88}
    .max-score{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:4px}
    .result-msg{font-size:1rem;color:rgba(255,255,255,.8);line-height:1.5;max-width:340px}
    .sum-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sum-item{background:rgba(255,255,255,.1);border-radius:14px;padding:14px}
    .sum-item .val{font-size:1.8rem;font-weight:800;color:#ffcc88}
    .sum-item .lbl{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:2px}
  </style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="lang-switch">
    <button class="lang-btn" id="lang-btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="badge" id="t-badge"></div>
  <div style="font-size:4.5rem;animation:float 3s ease-in-out infinite">🤝</div>
  <div class="title" id="t-title"></div>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="rules-box">
    <h3 id="t-rules-title"></h3>
    <ul>
      <li id="t-rule1"></li>
      <li id="t-rule2"></li>
      <li id="t-rule3"></li>
      <li id="t-rule4"></li>
    </ul>
  </div>
  <button class="btn-primary" id="t-btn-start" onclick="startGame()"></button>
  <a href="index.html" id="t-back-1" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="counter" id="counter">1 / 10</span>
    <span class="score-display">⭐ <span id="live-score">0</span> <span id="t-pts-label"></span></span>
  </div>
  <div class="timer-wrap"><div id="timer-bar"></div></div>
  <div class="scenario-card">
    <div class="sc-title" id="t-sc-title"></div>
    <div class="sc-cond">
      <div class="sc-cond-label" id="t-cond-label"></div>
      <div id="cond-text" style="font-size:.85rem;font-weight:600;color:#4a2a0a"></div>
    </div>
    <div class="sc-row">
      <div class="sc-prop">
        <div class="sc-prop-label" id="t-p-label"></div>
        <div id="p-text" style="font-size:.8rem"></div>
      </div>
      <div class="sc-status" id="p-status">?</div>
      <div class="sc-prop">
        <div class="sc-prop-label" id="t-q-label"></div>
        <div id="q-text" style="font-size:.8rem"></div>
      </div>
      <div class="sc-status" id="q-status">?</div>
    </div>
    <div class="sc-formula">p → q = ?</div>
  </div>
  <div class="answer-row">
    <button class="btn-answer btn-kept" onclick="answer(true)">
      <span class="icon">✅</span><span id="t-btn-kept"></span>
    </button>
    <button class="btn-answer btn-broken" onclick="answer(false)">
      <span class="icon">💔</span><span id="t-btn-broken"></span>
    </button>
  </div>
</div>

<div id="feedback" onclick="nextQ()">
  <div class="fb-card">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-rule"  id="fb-rule"></div>
    <p style="font-size:.95rem;font-weight:600;color:#777;margin-top:14px" id="t-tap-continue"></p>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-header" id="t-result-title"></div>
  <div style="font-size:2.2rem" id="result-stars"></div>
  <div class="score-box">
    <div class="big-score" id="final-score">0</div>
    <div class="max-score" id="t-max-score"></div>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <div class="sum-grid">
    <div class="sum-item"><div class="val" id="r-correct">0</div><div class="lbl" id="t-correct-label"></div></div>
    <div class="sum-item"><div class="val" id="r-wrong">0</div><div class="lbl" id="t-wrong-label"></div></div>
  </div>
  <button class="btn-primary" id="t-btn-restart" onclick="restartGame()"></button>
  <a href="index.html" id="t-back-2" style="display:block;margin-top:14px;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem"></a>
</div>

<script>
/* ── TEXTOS DA INTERFACE / UI STRINGS ─────────────── */
const STRINGS = {
  pt: {
    pageTitle: "No Mundo da Lógica — Lição VIII",
    htmlLang: "pt-BR",
    badge: "No Mundo da Lógica · Lição VIII",
    title: 'A Promessa<br><span>de Pedro</span>',
    subtitle: "A condicional (→) é como uma promessa: só é quebrada quando o primeiro combinado é cumprido mas o resultado não acontece!",
    rulesTitle: "Como jogar",
    rule1: 'Leia a condição <strong>p</strong> e o resultado <strong>q</strong>',
    rule2: "Veja o que realmente aconteceu",
    rule3: 'Decida: a promessa foi <strong>cumprida</strong> ou <strong>quebrada</strong>?',
    rule4: "Quebrada só se p=V e q=F. Leia com calma: há tempo de sobra!",
    btnStart: "Iniciar ▶",
    backLink: "← Todas as lições",
    ptsLabel: "pts",
    scTitle: "🤝 A condicional diz:",
    condLabel: "Se p, então q",
    pLabel: "p ocorreu?",
    qLabel: "q ocorreu?",
    btnKept: "PROMESSA<br>CUMPRIDA",
    btnBroken: "PROMESSA<br>QUEBRADA",
    tapContinue: "Toque para continuar",
    correctPrefix: "Correto!",
    timeUp: "Tempo esgotado!",
    wrongTitle: "Errado!",
    ruleBroken: "p=V e q=F → única combinação que QUEBRA a promessa (→ = F).",
    ruleNeverBroken: "p=F → a condicional nunca é quebrada, independente de q (→ = V).",
    ruleKept: "p=V e q=V → promessa cumprida na prática (→ = V).",
    resultTitle: 'Promessas<br><span>avaliadas!</span>',
    maxScore: n => `de ${n} pontos`,
    correctLabel: "Acertos",
    wrongLabel: "Erros/Tempo",
    btnRestart: "Jogar novamente 🔄",
    msgLow: "Continue praticando a condicional! 📖",
    msgMid: "Bom esforço! Lembre: → só é F quando p=V e q=F. 💪",
    msgGood: "Muito bom! Quase dominando a condicional! 😊",
    msgGreat: "Especialista em promessas! Você domina a condicional! 🏆"
  },
  en: {
    pageTitle: "In the World of Logic — Lesson VIII",
    htmlLang: "en",
    badge: "In the World of Logic · Lesson VIII",
    title: 'The Promise<br><span>of Peter</span>',
    subtitle: "The conditional (→) is like a promise: it's only broken when the first part comes true but the result doesn't happen!",
    rulesTitle: "How to play",
    rule1: 'Read the condition <strong>p</strong> and the result <strong>q</strong>',
    rule2: "See what actually happened",
    rule3: 'Decide: was the promise <strong>kept</strong> or <strong>broken</strong>?',
    rule4: "Broken only if p=T and q=F. Read calmly: there is plenty of time!",
    btnStart: "Start ▶",
    backLink: "← All lessons",
    ptsLabel: "pts",
    scTitle: "🤝 The conditional says:",
    condLabel: "If p, then q",
    pLabel: "Did p happen?",
    qLabel: "Did q happen?",
    btnKept: "PROMISE<br>KEPT",
    btnBroken: "PROMISE<br>BROKEN",
    tapContinue: "Tap to continue",
    correctPrefix: "Correct!",
    timeUp: "Time's up!",
    wrongTitle: "Wrong!",
    ruleBroken: "p=T and q=F → the only combination that BREAKS the promise (→ = F).",
    ruleNeverBroken: "p=F → the conditional is never broken, regardless of q (→ = T).",
    ruleKept: "p=T and q=T → promise kept in practice (→ = T).",
    resultTitle: 'Promises<br><span>evaluated!</span>',
    maxScore: n => `out of ${n} points`,
    correctLabel: "Correct",
    wrongLabel: "Wrong/Timeout",
    btnRestart: "Play again 🔄",
    msgLow: "Keep practicing the conditional! 📖",
    msgMid: "Good effort! Remember: → is only F when p=T and q=F. 💪",
    msgGood: "Very good! Almost mastering the conditional! 😊",
    msgGreat: "Promise expert! You've mastered the conditional! 🏆"
  }
};

// cond: "Se [p], então [q]" | pV, qV | result=pV→qV = !(pV&&!qV)
const QUESTIONS=[
  {cond:{pt:"Se Deus é Santo, então Jesus ressuscitou.",en:"If God is Holy, then Jesus rose from the dead."},p:{pt:"Deus é Santo.",en:"God is Holy."},pV:true,q:{pt:"Jesus ressuscitou.",en:"Jesus rose from the dead."},qV:true},
  {cond:{pt:"Se o triângulo tem 3 lados, então o sol é feito de gelo.",en:"If the triangle has 3 sides, then the sun is made of ice."},p:{pt:"O triângulo tem 3 lados.",en:"The triangle has 3 sides."},pV:true,q:{pt:"O sol é feito de gelo.",en:"The sun is made of ice."},qV:false},
  {cond:{pt:"Se o pecado é bom, então Deus é o Criador.",en:"If sin is good, then God is the Creator."},p:{pt:"O pecado é bom.",en:"Sin is good."},pV:false,q:{pt:"Deus é o Criador.",en:"God is the Creator."},qV:true},
  {cond:{pt:"Se 2+2=5, então Judas foi fiel.",en:"If 2+2=5, then Judas was faithful."},p:{pt:"2 + 2 = 5",en:"2 + 2 = 5"},pV:false,q:{pt:"Judas foi fiel.",en:"Judas was faithful."},qV:false},
  {cond:{pt:"Se o fogo queima, então a neve é quente.",en:"If fire burns, then snow is hot."},p:{pt:"O fogo queima.",en:"Fire burns."},pV:true,q:{pt:"A neve é quente.",en:"Snow is hot."},qV:false},
  {cond:{pt:"Se Deus é Fiel, então Deus é Justo.",en:"If God is Faithful, then God is Just."},p:{pt:"Deus é Fiel.",en:"God is Faithful."},pV:true,q:{pt:"Deus é Justo.",en:"God is Just."},qV:true},
  {cond:{pt:"Se 14 é par, então 14 termina com 0.",en:"If 14 is even, then 14 ends in 0."},p:{pt:"14 é par.",en:"14 is even."},pV:true,q:{pt:"14 termina com 0.",en:"14 ends in 0."},qV:false},
  {cond:{pt:"Se Jesus morreu na cruz, então o homem pode ser perdoado.",en:"If Jesus died on the cross, then man can be forgiven."},p:{pt:"Jesus morreu na cruz.",en:"Jesus died on the cross."},pV:true,q:{pt:"O homem pode ser perdoado.",en:"Man can be forgiven."},qV:true},
  {cond:{pt:"Se Noé construiu uma arca, então Moisés abriu o Mar Vermelho.",en:"If Noah built an ark, then Moses parted the Red Sea."},p:{pt:"Noé construiu uma arca.",en:"Noah built an ark."},pV:true,q:{pt:"Moisés abriu o Mar Vermelho.",en:"Moses parted the Red Sea."},qV:true},
  {cond:{pt:"Se 5×3=20, então Jesus é o Filho de Deus.",en:"If 5×3=20, then Jesus is the Son of God."},p:{pt:"5 × 3 = 20",en:"5 × 3 = 20"},pV:false,q:{pt:"Jesus é o Filho de Deus.",en:"Jesus is the Son of God."},qV:true},
];

const TIME_BASE=11;   // segundos de reflexão / thinking seconds
const TIME_MIN=16;    // tempo mínimo por questão / minimum time per question
let tLimit=TIME_MIN,fbShownAt=0;
let questions,current,score,correctCount,wrongCount,timer,qStart;

/* ── TEMPO PARA RESPONDER / TIME TO ANSWER ───────────
   Tempo da questão = tempo de reflexão (base) + leitura (≈ 0,8 s por palavra,
   ritmo confortável para uma criança de 9 anos), nunca abaixo de um mínimo.
   Question time = thinking time (base) + reading (≈ 0.8 s per word,
   comfortable for a 9-year-old), never below a minimum. */
function contarPalavras(...textos){ return textos.join(' ').replace(/<[^>]*>/g,' ').trim().split(/\s+/).filter(Boolean).length; }
function tempoDaQuestao(palavras, base, minimo){ return Math.max(minimo, Math.round(base + 0.8 * palavras)); }

/* O relógio fica parado enquanto a aba/tela estiver oculta.
   The clock stays paused while the tab/screen is hidden. */
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); }
  else if (hiddenAt !== null) { qStart += Date.now() - hiddenAt; hiddenAt = null; }
});

let LANG='pt';
try{
  const saved=localStorage.getItem('nml_lang');
  if(saved==='pt'||saved==='en')LANG=saved;
}catch(e){/* localStorage indisponível / unavailable — mantém pt / keep default */}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* ── IDIOMA / LANGUAGE ───────────────────────────── */
function setLang(lang){
  LANG=lang;
  try{localStorage.setItem('nml_lang',lang)}catch(e){/* ignore */}
  applyChrome();
  // Se já houver uma questão carregada na tela de jogo, atualiza o texto dela também
  // If a question is already loaded on the game screen, refresh its text too
  if(typeof questions!=='undefined'&&questions&&questions[current]&&
     document.getElementById('screen-game').classList.contains('active')){
    const q=questions[current];
    document.getElementById('cond-text').textContent=q.cond[LANG];
    document.getElementById('p-text').textContent=q.p[LANG];
    document.getElementById('q-text').textContent=q.q[LANG];
  }
}

function applyChrome(){
  const s=STRINGS[LANG];
  document.documentElement.lang=s.htmlLang;
  document.title=s.pageTitle;

  document.getElementById('lang-btn-pt').classList.toggle('active',LANG==='pt');
  document.getElementById('lang-btn-en').classList.toggle('active',LANG==='en');

  document.getElementById('t-badge').textContent=s.badge;
  document.getElementById('t-title').innerHTML=s.title;
  document.getElementById('t-subtitle').textContent=s.subtitle;
  document.getElementById('t-rules-title').textContent=s.rulesTitle;
  document.getElementById('t-rule1').innerHTML=s.rule1;
  document.getElementById('t-rule2').textContent=s.rule2;
  document.getElementById('t-rule3').innerHTML=s.rule3;
  document.getElementById('t-rule4').textContent=s.rule4;
  document.getElementById('t-btn-start').textContent=s.btnStart;
  document.getElementById('t-back-1').textContent=s.backLink;
  document.getElementById('t-back-2').textContent=s.backLink;
  document.getElementById('t-pts-label').textContent=s.ptsLabel;
  document.getElementById('t-sc-title').textContent=s.scTitle;
  document.getElementById('t-cond-label').textContent=s.condLabel;
  document.getElementById('t-p-label').textContent=s.pLabel;
  document.getElementById('t-q-label').textContent=s.qLabel;
  document.getElementById('t-btn-kept').innerHTML=s.btnKept;
  document.getElementById('t-btn-broken').innerHTML=s.btnBroken;
  document.getElementById('t-tap-continue').textContent=s.tapContinue;
  document.getElementById('t-result-title').innerHTML=s.resultTitle;
  document.getElementById('t-max-score').textContent=s.maxScore(QUESTIONS.length*100);
  document.getElementById('t-correct-label').textContent=s.correctLabel;
  document.getElementById('t-wrong-label').textContent=s.wrongLabel;
  document.getElementById('t-btn-restart').textContent=s.btnRestart;
}

function startGame(){questions=shuffle(QUESTIONS);current=0;score=0;correctCount=0;wrongCount=0;show('screen-game');loadQ()}

function loadQ(){
  if(current>=questions.length){endGame();return}
  const q=questions[current];
  tLimit=tempoDaQuestao(contarPalavras(q.cond[LANG]),TIME_BASE,TIME_MIN);
  document.getElementById('cond-text').textContent=q.cond[LANG];
  document.getElementById('p-text').textContent=q.p[LANG];
  document.getElementById('q-text').textContent=q.q[LANG];
  const ps=document.getElementById('p-status');ps.textContent=q.pV?'✅':'❌';ps.className='sc-status '+(q.pV?'s-true':'s-false');
  const qs=document.getElementById('q-status');qs.textContent=q.qV?'✅':'❌';qs.className='sc-status '+(q.qV?'s-true':'s-false');
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('live-score').textContent=score;
  document.querySelector('.btn-kept').disabled=false;document.querySelector('.btn-broken').disabled=false;
  const bar=document.getElementById('timer-bar');bar.style.width='100%';bar.classList.remove('danger');
  qStart=Date.now();clearInterval(timer);
  timer=setInterval(()=>{
    if(document.hidden)return;   // relógio parado / clock paused
    const e=(Date.now()-qStart)/1000,pct=Math.max(0,1-e/tLimit);
    bar.style.width=(pct*100)+'%';if(pct<.3)bar.classList.add('danger');
    if(e>=tLimit){clearInterval(timer);answer(null)}
  },80);
}

function answer(userKept){
  clearInterval(timer);
  document.querySelector('.btn-kept').disabled=true;document.querySelector('.btn-broken').disabled=true;
  const s=STRINGS[LANG];
  const q=questions[current];
  const result=!(q.pV&&!q.qV); // condicional
  const ok=(userKept===result);
  const timeout=(userKept===null);
  let pts=0;
  if(ok){const e=(Date.now()-qStart)/1000;pts=Math.max(20,Math.round(100-e/tLimit*80));score+=pts;correctCount++}
  else wrongCount++;
  let rule;
  if(q.pV&&!q.qV)rule=s.ruleBroken;
  else if(!q.pV)rule=s.ruleNeverBroken;
  else rule=s.ruleKept;
  document.getElementById('fb-icon').textContent=ok?'✅':timeout?'⏱️':'💔';
  document.getElementById('fb-title').textContent=ok?s.correctPrefix+' +'+pts+' '+s.ptsLabel:timeout?s.timeUp:s.wrongTitle;
  document.getElementById('fb-title').className='fb-title '+(ok?'ok':'no');
  document.getElementById('fb-rule').textContent=rule;
  document.getElementById('feedback').classList.add('show');
  fbShownAt=Date.now();
}

function nextQ(){if(Date.now()-fbShownAt<1200)return;   // ignora toque duplo sem querer / ignore accidental double-tap
  document.getElementById('feedback').classList.remove('show');current++;loadQ()}

function endGame(){
  const s=STRINGS[LANG];
  show('screen-result');
  document.getElementById('final-score').textContent=score;
  document.getElementById('r-correct').textContent=correctCount;
  document.getElementById('r-wrong').textContent=wrongCount;
  const pct=correctCount/QUESTIONS.length;
  let stars='⭐',msg=s.msgLow;
  if(pct>=.9){stars='⭐⭐⭐';msg=s.msgGreat}
  else if(pct>=.7){stars='⭐⭐';msg=s.msgGood}
  else if(pct>=.5){stars='⭐½';msg=s.msgMid}
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-msg').textContent=msg;
}
function restartGame(){startGame()}

/* ── INICIALIZAÇÃO / INIT ────────────────────────── */
applyChrome();
</script>
